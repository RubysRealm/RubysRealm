name: Build Takarada Display APK

on:
  push:
    branches: [takarada-virtual-phone]
    paths:
      - 'virtual-phone/display-app/**'
      - '.github/workflows/takarada-display-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p virtual-phone/display-app assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: takarada-display-apk
          path: virtual-phone/display-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
