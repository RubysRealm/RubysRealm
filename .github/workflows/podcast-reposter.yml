name: Ruby's Realm ordered podcast reposts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/podcast-reposter.yml'
      - 'tiktok_animator/podcast_prepare.py'
      - 'tiktok_animator/podcast_state.json'
      - 'tiktok_animator/podcast_queue.json'
      - 'api/auto-post.js'
  schedule:
    - cron: '19 * * * *'

permissions:
  contents: write

concurrency:
  group: rubys-realm-podcast-reposter
  cancel-in-progress: false

jobs:
  post-next-part:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install video and caption tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip yt-dlp faster-whisper

      - name: Refill next story chronologically when current story is complete
        run: |
          set -euo pipefail
          python tiktok_animator/podcast_catalog.py

      - name: Persist newly discovered next story
        run: |
          set -euo pipefail
          if git diff --quiet -- tiktok_animator/podcast_queue.json; then
            echo 'No new story discovered.'
            exit 0
          fi
          git config user.name 'Ruby Realm Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add tiktok_animator/podcast_queue.json
          git commit -m 'Queue next Master POV story chronologically'
          git push

      - name: Prepare exactly the next allowed part
        env:
          WHISPER_MODEL: small.en
        run: |
          set -euo pipefail
          rm -rf tiktok_animator/podcast_output
          python tiktok_animator/podcast_prepare.py
          if [ -f tiktok_animator/podcast_output/manifest.json ]; then
            echo 'READY=1' >> "$GITHUB_ENV"
          else
            echo 'READY=0' >> "$GITHUB_ENV"
          fi

      - name: Enforce visible story title, part number, and synced captions
        if: env.READY == '1'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('tiktok_animator/podcast_output/manifest.json').read_text())
          required={
              'storyTitleBurnedIn': True,
              'partLabelBurnedIn': True,
              'captionsBurnedIn': True,
          }
          for key,value in required.items():
              if m.get(key) is not value:
                  raise SystemExit(f'Blocked: {key} is not enabled')
          if m.get('captionTiming') != 'word-timestamped narration transcription':
              raise SystemExit('Blocked: captions are not narration word-timestamped')
          if not m.get('title') or not m.get('partNumber') or not m.get('totalParts'):
              raise SystemExit('Blocked: story/part identity missing')
          print(f"Approved: {m['title']} — Part {m['partNumber']}/{m['totalParts']} with synced captions")
          PY

      - name: Publish part as a GitHub release asset
        if: env.READY == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="podcast-part-${GITHUB_RUN_ID}"
          MANIFEST='tiktok_animator/podcast_output/manifest.json'
          VIDEO="$(python -c 'import json; print("tiktok_animator/podcast_output/"+json.load(open("tiktok_animator/podcast_output/manifest.json"))["file"])')"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "$VIDEO" "$MANIFEST#manifest.json" --title "Ruby's Realm ordered podcast part ${GITHUB_RUN_NUMBER}" --notes "Prepared from the locked daily story queue with persistent story/part title and narration-synced captions."
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Wait for existing TikTok posting endpoint deployment
        if: env.READY == '1'
        run: |
          set -euo pipefail
          URL='https://rubys-realm.vercel.app/api/auto-post'
          for i in $(seq 1 48); do
            CODE="$(curl -sS -o /tmp/podcast-probe.json -w '%{http_code}' "$URL" || true)"
            if [ "$CODE" = '400' ]; then
              echo 'Combined TikTok posting endpoint is deployed.'
              exit 0
            fi
            sleep 5
          done
          cat /tmp/podcast-probe.json || true
          exit 1

      - name: Send locked part to connected TikTok channel
        if: env.READY == '1'
        run: |
          set -euo pipefail
          URL="https://rubys-realm.vercel.app/api/auto-post?tag=${RELEASE_TAG}"
          RESPONSE=''
          for i in $(seq 1 20); do
            RESPONSE="$(curl -sS --max-time 90 "$URL" || true)"
            if printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("ok") else 1)' 2>/dev/null; then
              break
            fi
            sleep 10
          done
          printf '%s\n' "$RESPONSE"
          printf '%s' "$RESPONSE" > /tmp/podcast-post-response.json
          POST_ID="$(python -c 'import json; d=json.load(open("/tmp/podcast-post-response.json")); assert d.get("ok"), d; print(d.get("postId") or "")')"
          test -n "$POST_ID"
          echo "POST_ID=$POST_ID" >> "$GITHUB_ENV"

      - name: Advance only after connected-channel post is accepted
        if: env.READY == '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          state_path=Path('tiktok_animator/podcast_state.json')
          manifest=json.loads(Path('tiktok_animator/podcast_output/manifest.json').read_text())
          state=json.loads(state_path.read_text())
          expected=int(state.get('next_part',1))
          actual=int(manifest['partNumber'])
          if actual != expected:
              raise SystemExit(f'refusing state advance: expected {expected}, prepared {actual}')
          state['last_publish_id']='${{ env.POST_ID }}'
          state['last_published_at']=datetime.now(ZoneInfo('America/New_York')).isoformat()
          state['next_part']=expected+1
          state_path.write_text(json.dumps(state,indent=2)+'\n')
          print(f'Advanced locked queue from Part {expected} to Part {expected+1}')
          PY
          git config user.name 'Ruby Realm Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add tiktok_animator/podcast_state.json
          git commit -m "Advance ordered podcast queue after TikTok acceptance"
          git push
