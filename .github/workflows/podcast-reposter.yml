name: Ruby's Realm ordered podcast reposts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/podcast-reposter.yml'
  schedule:
    - cron: '19 * * * *'

permissions:
  contents: write

concurrency:
  group: rubys-realm-podcast-reposter
  cancel-in-progress: false

jobs:
  post-next-part:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip yt-dlp

      - name: Publish exactly the next allowed part
        env:
          TT_TOKEN: ${{ secrets.TT_TOKEN }}
        run: |
          set -euo pipefail
          python tiktok_animator/podcast_reposter.py

      - name: Persist sequence state only after successful publish
        run: |
          set -euo pipefail
          if git diff --quiet -- tiktok_animator/podcast_state.json; then
            echo 'No state advancement to persist.'
            exit 0
          fi
          git config user.name 'Ruby Realm Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add tiktok_animator/podcast_state.json
          git commit -m 'Advance ordered podcast posting state'
          git push
