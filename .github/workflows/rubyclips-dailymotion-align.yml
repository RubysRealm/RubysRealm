name: RubyClips Dailymotion continuity align
on:
  push:
    paths:
      - 'rubyclips/dailymotion_align.trigger'
permissions:
  contents: read
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade yt-dlp numpy
      - name: Download full story and posted Part 11
        run: |
          yt-dlp --no-playlist -f hls-380 -o rubyclips/dm_full.mp4 'https://www.dailymotion.com/video/xb2tc0i'
          curl -L --fail --retry 3 -o rubyclips/dm_part11.mp4 'https://github.com/RubysRealm/RubysRealm/releases/download/rubyclips-tt-7682993954661553173-r2-p11/muffindrama-7682993954661553173-r2-part-11.mp4'
      - name: Align continuity
        run: python rubyclips/dailymotion_align.py
      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubyclips-dailymotion-alignment
          path: rubyclips/dailymotion_alignment.json
          if-no-files-found: warn
          retention-days: 1
