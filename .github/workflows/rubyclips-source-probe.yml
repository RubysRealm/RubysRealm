name: RubyClips source recovery probe

on:
  push:
    paths:
      - 'rubyclips/source_probe.trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Install yt-dlp
        run: python3 -m pip install -U yt-dlp
      - name: Probe YouTube source
        shell: bash
        run: |
          set -euo pipefail
          SRC='https://www.youtube.com/watch?v=q3h9Ke6boiU'
          yt-dlp --no-playlist --dump-single-json "$SRC" > /tmp/meta.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/meta.json'))
          print('SOURCE_OK', d.get('id'), d.get('title'), d.get('duration'))
          PY
          yt-dlp --no-playlist -f 'b[ext=mp4]/b' --max-filesize 20M -o /tmp/probe.mp4 "$SRC" || true
          ls -lh /tmp/probe.mp4* 2>/dev/null || true
