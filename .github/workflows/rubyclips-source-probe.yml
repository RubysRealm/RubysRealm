name: RubyClips source recovery probe

on:
  push:
    paths:
      - 'rubyclips/source_probe.trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TikTok source tools
        run: python -m pip install -U yt-dlp
      - name: List oldest MuffinDrama uploads
        run: |
          python - <<'PY'
          import json
          from yt_dlp import YoutubeDL

          url='https://www.tiktok.com/@muffindrama_us'
          opts={
              'quiet': True,
              'no_warnings': True,
              'extract_flat': True,
              'skip_download': True,
              'playlistend': 500,
              'socket_timeout': 45,
              'retries': 3,
          }
          with YoutubeDL(opts) as ydl:
              info=ydl.extract_info(url, download=False)
          entries=[]
          for e in (info or {}).get('entries') or []:
              if not e: continue
              vid=str(e.get('id') or '').strip()
              title=str(e.get('title') or e.get('description') or '').replace('\n',' ').strip()
              ts=int(e.get('timestamp') or e.get('release_timestamp') or 0)
              webpage=str(e.get('webpage_url') or e.get('url') or '')
              entries.append({'id':vid,'title':title,'timestamp':ts,'url':webpage})
          if not entries:
              raise SystemExit('No TikTok entries returned')
          entries.sort(key=lambda x: (x['timestamp'] or 10**18, x['id']))
          print('TOTAL', len(entries))
          print('OLDEST_40_JSON')
          print(json.dumps(entries[:40], ensure_ascii=False, indent=2))
          PY
