name: RubyClips source recovery probe

on:
  push:
    paths:
      - 'rubyclips/source_probe.trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe MuffinDrama through TikWM
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.parse, urllib.request

          START_ID='7682997000391904526'
          USER='muffindrama_us'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'

          def get_json(url):
              req=urllib.request.Request(url, headers={'User-Agent':UA,'Accept':'application/json'})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.loads(r.read().decode('utf-8','replace'))

          video_api='https://www.tikwm.com/api/?'+urllib.parse.urlencode({'url':START_ID,'hd':'1'})
          direct=get_json(video_api)
          print('DIRECT_CODE', direct.get('code'), direct.get('msg'))
          d=direct.get('data') or {}
          keep={k:d.get(k) for k in ['id','title','duration','create_time','play','hdplay','wmplay','cover']}
          keep['author']=(d.get('author') or {}).get('unique_id')
          print('DIRECT_JSON')
          print(json.dumps(keep,ensure_ascii=False,indent=2))
          if str(d.get('id')) != START_ID:
              raise SystemExit('TikWM did not resolve the confirmed start video.')
          if not (d.get('hdplay') or d.get('play')):
              raise SystemExit('TikWM returned no playable video URL.')

          videos=[]
          cursor='0'
          found=False
          for page in range(1,45):
              api='https://www.tikwm.com/api/user/posts?'+urllib.parse.urlencode({'unique_id':USER,'count':'35','cursor':cursor})
              resp=get_json(api)
              if resp.get('code') != 0:
                  print('FEED_ERROR', page, resp.get('code'), resp.get('msg'))
                  break
              data=resp.get('data') or {}
              batch=data.get('videos') or data.get('items') or []
              print('PAGE',page,'COUNT',len(batch),'CURSOR',data.get('cursor'),'HAS_MORE',data.get('has_more'))
              for v in batch:
                  row={
                      'id':str(v.get('video_id') or v.get('id') or ''),
                      'title':str(v.get('title') or ''),
                      'duration':v.get('duration'),
                      'create_time':v.get('create_time'),
                  }
                  videos.append(row)
                  if row['id']==START_ID:
                      found=True
              if found:
                  break
              if not data.get('has_more'):
                  break
              nxt=str(data.get('cursor') or '')
              if not nxt or nxt==cursor:
                  break
              cursor=nxt
              time.sleep(0.4)

          print('TOTAL_FETCHED',len(videos),'FOUND_START',found)
          if videos:
              chronological=list(reversed(videos))
              if found:
                  pos=next(i for i,v in enumerate(chronological) if v['id']==START_ID)
                  around=chronological[pos:pos+20]
              else:
                  around=chronological[:20]
              print('CHRONO_FROM_START_JSON')
              print(json.dumps(around,ensure_ascii=False,indent=2))
          PY
