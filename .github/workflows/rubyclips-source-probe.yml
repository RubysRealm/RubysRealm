name: RubyClips source recovery probe

on:
  push:
    paths:
      - 'rubyclips/source_probe.trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe alternate source relays
        shell: bash
        run: |
          set +e
          SRC='https://www.youtube.com/watch?v=q3h9Ke6boiU'
          for API in 'https://cobalt-api.meowing.de/' 'https://capi.3kh0.net/'; do
            echo "PROBING $API"
            CODE="$(curl -L -sS --max-time 60 -o /tmp/cobalt.json -w '%{http_code}' \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -H 'User-Agent: rubys-realm-source/1.0 (+https://github.com/RubysRealm/RubysRealm)' \
              --data "{\"url\":\"$SRC\",\"videoQuality\":\"720\",\"downloadMode\":\"auto\",\"youtubeVideoCodec\":\"h264\"}" \
              "$API")"
            echo "HTTP $CODE"
            cat /tmp/cobalt.json || true
            echo
            if [ "$CODE" = '200' ]; then
              URL="$(python3 - <<'PY'
import json
try:
 d=json.load(open('/tmp/cobalt.json'))
 print(d.get('url') or '')
except Exception:
 print('')
PY
)"
              if [ -n "$URL" ]; then
                echo "SOURCE_URL_OK"
                RC="$(curl -L -sS --connect-timeout 5 --max-time 30 -r 0-1048575 -o /tmp/source.bin -w '%{http_code}' "$URL")"
                SIZE="$(wc -c </tmp/source.bin 2>/dev/null || echo 0)"
                echo "RANGE_HTTP=$RC SIZE=$SIZE"
                if [ "$SIZE" -gt 100000 ]; then exit 0; fi
              fi
            fi
          done
          exit 1
