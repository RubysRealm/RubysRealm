name: Rubaradaclips bgutil transport probe
on:
  push:
    paths:
      - 'rubyclips/source_probe.trigger'
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install current yt-dlp and bgutil 2.0
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade yt-dlp 'bgutil-ytdlp-pot-provider==2.0.0'
          rm -rf "$HOME/bgutil-ytdlp-pot-provider"
          git clone --quiet --depth 1 --branch 2.0.0 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$HOME/bgutil-ytdlp-pot-provider"
          cd "$HOME/bgutil-ytdlp-pot-provider/server"
          npm ci --no-audit --no-fund
          npx tsc
          node build/generate_once.js | tail -n 1 | tee /tmp/pot.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/pot.json'))
          assert d.get('poToken') and d.get('contentBinding'), d
          print('POT_GENERATION_OK')
          PY
      - name: Probe exact Spotify-selected public video with vendor settings
        shell: bash
        run: |
          set -uo pipefail
          URL='https://www.youtube.com/watch?v=jXkBF-MCjEA'
          SERVER="$HOME/bgutil-ytdlp-pot-provider/server"
          yt-dlp -vF --color never             --ignore-no-formats-error             --js-runtimes node             --remote-components ejs:github             --extractor-args "youtube:player_client=web,web_music,mweb;pot_trace=true;fetch_pot=always"             --extractor-args "youtubepot-bgutilscript:server_home=$SERVER"             "$URL" 2>&1 | tee /tmp/probe.log
          RC=${PIPESTATUS[0]}
          echo "probe_exit=$RC"
          grep -E "\\[pot:bgutil|Generated POT|Generating POT|Available formats|Sign in|bot|ERROR|WARNING" /tmp/probe.log | tail -n 200 || true
          exit "$RC"
      - name: Download a short proof segment
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.youtube.com/watch?v=jXkBF-MCjEA'
          SERVER="$HOME/bgutil-ytdlp-pot-provider/server"
          yt-dlp             --js-runtimes node             --remote-components ejs:github             --extractor-args "youtube:player_client=web,web_music,mweb;pot_trace=true;fetch_pot=always"             --extractor-args "youtubepot-bgutilscript:server_home=$SERVER"             --download-sections '*0-20'             -f 'best[height<=720]/best'             --merge-output-format mp4             -o /tmp/proof.%(ext)s             "$URL"
          ls -lh /tmp/proof.*
          test "$(find /tmp -maxdepth 1 -name 'proof.*' -type f -size +500k | wc -l | tr -d ' ')" -ge 1
