name: Rubaradaclips Invidious media probe
on:
  push:
    paths:
      - 'rubyclips/source_probe.trigger'
      - '.github/workflows/rubyclips-source-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe current Invidious playback routes
        shell: bash
        run: |
          set +e
          VIDEO='jXkBF-MCjEA'
          for BASE in \
            'https://inv.nadeko.net' \
            'https://invidious.nerdvpn.de' \
            'https://yt.chocolatemoo53.com' \
            'https://invidious.tiekoetter.com'
          do
            echo "=== $BASE ==="
            URL="$BASE/latest_version?id=$VIDEO&itag=18&local=true"
            rm -f /tmp/iv.bin /tmp/iv.headers
            CODE=$(curl -L --max-time 25 -A 'Mozilla/5.0' -r 0-1048575 -D /tmp/iv.headers -o /tmp/iv.bin -sS -w '%{http_code}' "$URL")
            echo "HTTP=$CODE SIZE=$(wc -c </tmp/iv.bin 2>/dev/null || echo 0)"
            tail -20 /tmp/iv.headers || true
            file /tmp/iv.bin || true
            xxd -l 24 /tmp/iv.bin || true
          done
