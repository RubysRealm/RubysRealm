name: Rubaradaclips Spotify audio-native probe
on:
  push:
    paths:
      - 'rubyclips/source_probe.trigger'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Votify and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade votify
      - name: Probe anonymous Spotify episode audio path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio,json,pathlib,urllib.request
          EP='2GIOjWw1E90bvEXGCPoEWA'
          async def main():
              from votify.api.api import SpotifyApi
              from votify.api.enums import SessionType
              api=await SpotifyApi.create(session_type=SessionType.WEB)
              try:
                  d=await api.get_episode(EP)
                  e=d['data']['episodeUnionV2']
                  items=((e.get('audio') or {}).get('items') or [])
                  print('EPISODE',e.get('name'))
                  print('MEDIA_TYPES',e.get('mediaTypes'))
                  print('AUDIO_ITEMS',json.dumps(items,indent=2)[:12000])
                  if not items: raise RuntimeError('No audio items in public episode metadata')
                  successes=[]
                  for item in items:
                      u=str(item.get('url') or '')
                      fmt=str(item.get('format') or '')
                      file_id=u.rstrip('/').split('/')[-1]
                      if not file_id: continue
                      # Map common public podcast formats used by votify.
                      format_id={'OGG_VORBIS_96':'0','OGG_VORBIS_160':'1','OGG_VORBIS_320':'2',
                                 'MP3_96':'6','MP3_160':'5','MP3_256':'3','MP3_320':'4'}.get(fmt)
                      if format_id is None: continue
                      try:
                          s=await api.get_audio_stream_urls(format_id,file_id)
                          cdn=(s.get('cdnurl') or [None])[0]
                          if not cdn: continue
                          print('CDN_OK',fmt,cdn[:180])
                          req=urllib.request.Request(cdn,headers={'User-Agent':'Mozilla/5.0','Range':'bytes=0-1048575'})
                          with urllib.request.urlopen(req,timeout=45) as r:
                              b=r.read(1048576)
                              print('READ_OK',r.status,r.headers.get('content-type'),len(b))
                          if len(b)>200000:
                              pathlib.Path('/tmp/audio-url.txt').write_text(cdn)
                              pathlib.Path('/tmp/audio-format.txt').write_text(fmt)
                              successes.append((fmt,len(b)))
                              break
                      except Exception as ex:
                          print('AUDIO_ROUTE_FAIL',fmt,repr(ex))
                  if not successes: raise RuntimeError('No anonymous Spotify audio CDN route succeeded')
                  print('SPOTIFY_AUDIO_NATIVE_OK',successes)
              finally:
                  await api.client.aclose()
          asyncio.run(main())
          PY
      - name: Verify ffmpeg can read source
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat /tmp/audio-url.txt)"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$URL" | tee /tmp/duration.txt
          python - <<'PY'
          d=float(open('/tmp/duration.txt').read().strip())
          assert d>60,d
          print('AUDIO_DURATION_OK',d)
          PY
