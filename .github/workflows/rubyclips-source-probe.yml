name: RubyClips source recovery probe

on:
  push:
    paths:
      - 'rubyclips/source_probe.trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe resilient source routes
        shell: bash
        run: |
          set +e
          ID=q3h9Ke6boiU
          for HOST in inv.nadeko.net invidious.nerdvpn.de yt.chocolatemoo53.com
          do
            echo "HOST=$HOST"
            curl -A "Mozilla/5.0" -L --max-time 25 -sS "https://$HOST/api/v1/videos/$ID" -o "/tmp/out.json"
            echo "STATUS=$? SIZE=$(wc -c < /tmp/out.json 2>/dev/null || echo 0)"
            head -c 20000 /tmp/out.json 2>/dev/null
            echo
          done
          echo SALDA
          curl -A "Mozilla/5.0" -L --max-time 25 -sS "https://salda.ws/video.php?id=$ID" -o /tmp/salda.html
          echo "SALDA_SIZE=$(wc -c < /tmp/salda.html 2>/dev/null || echo 0)"
          grep -Eio 'https?[^" <>]+' /tmp/salda.html | grep -Ei 'mp4|m3u8|videoplayback|googlevideo' | head -80
          grep -Ei 'mp4|m3u8|source|player' /tmp/salda.html | head -80
