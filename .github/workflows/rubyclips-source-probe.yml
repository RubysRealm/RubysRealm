name: Rubaradaclips alternate YouTube client probe
on:
  push:
    paths:
      - 'rubyclips/source_probe.trigger'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install yt-dlp
        run: python -m pip install --quiet --upgrade yt-dlp
      - name: Probe alternate playback clients
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, pathlib
          video='gTZi1vZ4Zes'
          clients=['default','visionos','android_vr','ios','tv','tv_downgraded','tv_simply','web_embedded']
          rows=[]
          winner=None
          for client in clients:
              cmd=[
                'yt-dlp','--dump-single-json','--no-warnings','--no-playlist',
                '--socket-timeout','20','--retries','2',
                '--js-runtimes','node','--remote-components','ejs:github',
              ]
              if client!='default':
                  cmd += ['--extractor-args',f'youtube:player_client={client}']
              cmd += [f'https://www.youtube.com/watch?v={video}']
              try:
                  p=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=90)
                  lines=[x for x in p.stdout.splitlines() if x.lstrip().startswith('{')]
                  row={'client':client,'exit':p.returncode,'formats':0,'tail':p.stdout[-1200:]}
                  if lines:
                      try:
                          d=json.loads(lines[-1])
                          row['formats']=len(d.get('formats') or [])
                          row['title']=d.get('title')
                          row['duration']=d.get('duration')
                      except Exception as e: row['parseError']=repr(e)
              except Exception as e:
                  row={'client':client,'exit':999,'formats':0,'tail':repr(e)}
              print(json.dumps({k:v for k,v in row.items() if k!='tail'}))
              rows.append(row)
              if row['exit']==0 and row['formats']>0:
                  winner=client
                  pathlib.Path('/tmp/winner-client.txt').write_text(client)
                  break
          pathlib.Path('/tmp/client-results.json').write_text(json.dumps(rows,indent=2))
          if not winner:
              for r in rows: print(r['client'],r['tail'])
              raise SystemExit('NO_ALTERNATE_CLIENT_WORKED')
          PY
      - name: Download proof
        shell: bash
        run: |
          set -euo pipefail
          CLIENT="$(cat /tmp/winner-client.txt)"
          ARGS=()
          if [ "$CLIENT" != default ]; then ARGS=(--extractor-args "youtube:player_client=$CLIENT"); fi
          yt-dlp --js-runtimes node --remote-components ejs:github "${ARGS[@]}"             --download-sections '*0-15' -f 'best[height<=720]/best' --merge-output-format mp4             -o '/tmp/proof.%(ext)s' 'https://www.youtube.com/watch?v=gTZi1vZ4Zes'
          FILE="$(find /tmp -maxdepth 1 -name 'proof.*' -type f | head -1)"
          test -n "$FILE"
          test "$(stat -c%s "$FILE")" -gt 500000
          echo "PROOF_OK client=$CLIENT bytes=$(stat -c%s "$FILE")"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubaradaclips-alt-client-probe
          path: |
            /tmp/winner-client.txt
            /tmp/client-results.json
          if-no-files-found: ignore
          retention-days: 1
