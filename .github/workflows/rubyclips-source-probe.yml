name: Rubaradaclips Spotify public metadata probe
on:
  push:
    paths:
      - 'rubyclips/source_probe.trigger'
      - '.github/workflows/rubyclips-source-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Spotify client
        run: python -m pip install --quiet --upgrade votify
      - name: Inspect public episode media metadata
        run: |
          python - <<'PY'
          import asyncio, json
          from votify.api.api import SpotifyApi
          from votify.api.enums import SessionType
          EP='2GIOjWw1E90bvEXGCPoEWA'

          def walk(obj, path='root'):
              if isinstance(obj, dict):
                  for k,v in obj.items():
                      p=f'{path}.{k}'
                      kl=str(k).lower()
                      if isinstance(v,(str,int,float,bool)) and any(x in kl for x in ('url','uri','video','audio','image','rss','feed','file','media','duration')):
                          print('FIELD',p,'=',str(v)[:1600])
                      walk(v,p)
              elif isinstance(obj,list):
                  for i,v in enumerate(obj):
                      walk(v,f'{path}[{i}]')
              elif isinstance(obj,str) and ('http://' in obj or 'https://' in obj):
                  print('URL',path,'=',obj[:1600])

          async def main():
              api=await SpotifyApi.create(session_type=SessionType.WEB)
              try:
                  d=await api.get_episode(EP)
                  e=d.get('data',{}).get('episodeUnionV2',{})
                  print('TOP_KEYS',sorted(e.keys()))
                  print('MEDIA_TYPES',e.get('mediaTypes'))
                  walk(e,'episode')
              finally:
                  await api.client.aclose()
          asyncio.run(main())
          PY
