name: RubyClips source recovery probe

on:
  push:
    paths:
      - 'rubyclips/source_probe.trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TikTok source tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -U yt-dlp
      - name: Probe confirmed MuffinDrama Episode 1
        run: |
          set -euo pipefail
          URL='https://www.tiktok.com/@muffindrama_us/video/7682997000391904526'
          python - <<'PY'
          import json
          from yt_dlp import YoutubeDL
          url='https://www.tiktok.com/@muffindrama_us/video/7682997000391904526'
          opts={'quiet':True,'no_warnings':True,'skip_download':True,'socket_timeout':45,'retries':3}
          with YoutubeDL(opts) as ydl:
              info=ydl.extract_info(url, download=False)
          fields=['id','title','description','duration','timestamp','upload_date','uploader','uploader_id','webpage_url','playlist','playlist_id','playlist_title','channel','channel_id']
          print('METADATA_JSON')
          print(json.dumps({k:info.get(k) for k in fields},ensure_ascii=False,indent=2))
          PY
          yt-dlp --no-warnings --retries 3 --socket-timeout 45 -f 'bv*+ba/b' --merge-output-format mp4 -o '/tmp/episode1.%(ext)s' "$URL"
          FILE="$(ls /tmp/episode1.* | head -n1)"
          test -s "$FILE"
          ffprobe -v error -show_entries format=duration,size -of json "$FILE"
