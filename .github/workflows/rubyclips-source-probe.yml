name: RubyClips source recovery probe

on:
  push:
    paths:
      - 'rubyclips/source_probe.trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recovery dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'git+https://github.com/krypton-byte/tiktok-downloader.git'
      - name: Pull confirmed Episode 1 through SnapTik
        run: |
          set -euo pipefail
          python - <<'PY'
          from tiktok_downloader.snaptik import snaptik
          from tiktok_downloader.utils import Type

          VIDEO='https://www.tiktok.com/@muffindrama_us/video/7682997000391904526'
          media=snaptik(VIDEO)
          print('MEDIA_COUNT', len(media))
          for i,m in enumerate(media):
              print('MEDIA',i,'TYPE',getattr(m,'type',None),'URL',getattr(m,'json',None),'RENDER',bool(getattr(m,'render',None)))

          videos=[m for m in media if getattr(m,'type',None)==Type.VIDEO]
          if not videos:
              raise SystemExit('SnapTik returned no video candidates')
          chosen=videos[0]
          if not getattr(chosen,'json','') and getattr(chosen,'render',None):
              chosen=chosen.get_render()
          if not chosen or not getattr(chosen,'json',''):
              raise SystemExit('SnapTik video candidate has no downloadable URL')
          print('CHOSEN_URL',chosen.json)
          chosen.download('episode1.mp4',chunk_size=1024*1024)
          import os
          size=os.path.getsize('episode1.mp4')
          print('DOWNLOADED_BYTES',size)
          if size < 100000:
              raise SystemExit('Downloaded file is unexpectedly small')
          PY
      - name: Upload Episode 1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: muffindrama-episode1
          path: episode1.mp4
          retention-days: 1
