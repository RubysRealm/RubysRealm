name: RubyClips source recovery probe

on:
  push:
    paths:
      - 'rubyclips/source_probe.trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve Episode 1 URL
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent @tobyg74/tiktok-api-dl
          node <<'JS'
          const fs = require('fs');
          const Tiktok = require('@tobyg74/tiktok-api-dl');
          const source='https://www.tiktok.com/@muffindrama_us/video/7682997000391904526';
          (async()=>{
            const r=await Tiktok.Downloader(source,{version:'v2'});
            fs.writeFileSync('resolver.json',JSON.stringify(r,null,2));
            const url=r?.result?.video?.playAddr?.[0];
            if(!url) throw new Error('No playAddr returned');
            fs.writeFileSync('media_url.txt',url);
            console.log('MEDIA_URL_READY');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Download Episode 1
        run: |
          set -euo pipefail
          URL="$(cat media_url.txt)"
          curl -L --fail --retry 2 -A 'Mozilla/5.0' -e 'https://www.tiktok.com/' "$URL" -o episode1.mp4
          test $(stat -c%s episode1.mp4) -gt 100000
      - name: Verify video
        run: ffprobe -v error -show_entries format=duration,size -of json episode1.mp4
      - name: Upload Episode 1
        uses: actions/upload-artifact@v4
        with:
          name: muffindrama-episode1
          path: episode1.mp4
          retention-days: 1
      - name: Upload resolver diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-api-results
          path: resolver.json
          if-no-files-found: ignore
          retention-days: 1
