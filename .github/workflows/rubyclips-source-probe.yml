name: Rubaradaclips public mirror probe

on:
  push:
    paths:
      - 'rubyclips/source_probe.trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe RUclips mirror for Spotify-selected episode
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re, urllib.parse, urllib.request
          vid='jXkBF-MCjEA'
          urls=[
            f'https://ruclips.net/video/{vid}/video.html',
            f'https://ruclips.net/video/{vid}/',
            'https://babynojamie.ruclips.net/',
          ]
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          out=[]
          for url in urls:
              row={'url':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
                  with urllib.request.urlopen(req,timeout=35) as r:
                      raw=r.read(8_000_000)
                      final=r.geturl()
                      status=r.status
                  text=raw.decode('utf-8','replace')
                  row.update(status=status,final=final,bytes=len(raw),title='')
                  m=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
                  if m: row['title']=re.sub(r'\s+',' ',html.unescape(m.group(1))).strip()[:300]
                  pats=[
                    r'https?://[^"\'<>\s]+',
                    r'(?:href|src)=["\']([^"\']+)["\']'
                  ]
                  vals=[]
                  for pat in pats:
                      for m in re.finditer(pat,text,re.I):
                          v=m.group(1) if m.lastindex else m.group(0)
                          v=html.unescape(v).replace('\\/','/')
                          try: v=urllib.parse.urljoin(final,v)
                          except: pass
                          if any(k in v.lower() for k in ['googlevideo','videoplayback','.mp4','.m3u8','download','jXkbf-mcjea'.lower()]):
                              vals.append(v)
                  row['interesting']=list(dict.fromkeys(vals))[:80]
                  open('/tmp/ruclips.html','wb').write(raw)
              except Exception as e:
                  row['error']=repr(e)
              out.append(row)
          open('/tmp/ruclips-probe.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Try direct media candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          rows=json.load(open('/tmp/ruclips-probe.json'))
          candidates=[]
          for r in rows:
              for u in r.get('interesting',[]):
                  lu=u.lower()
                  if 'googlevideo' in lu or 'videoplayback' in lu or '.mp4' in lu or '.m3u8' in lu:
                      candidates.append(u)
          print('MEDIA_CANDIDATES',len(candidates))
          for i,u in enumerate(candidates[:12]):
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Range':'bytes=0-1048575','Referer':'https://ruclips.net/'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read(1048576)
                      print('CANDIDATE_OK',i,r.status,r.headers.get('content-type'),len(b),u[:240])
                      open('/tmp/media-sample.bin','wb').write(b)
                      open('/tmp/media-url.txt','w').write(u)
                      break
              except Exception as e:
                  print('CANDIDATE_FAIL',i,repr(e),u[:180])
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubaradaclips-ruclips-probe
          path: |
            /tmp/ruclips-probe.json
            /tmp/media-url.txt
            /tmp/media-sample.bin
          if-no-files-found: ignore
          retention-days: 1
