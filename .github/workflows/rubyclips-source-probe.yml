name: RubyClips source recovery probe

on:
  push:
    paths:
      - 'rubyclips/source_probe.trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start local Cobalt
        run: |
          set -euo pipefail
          docker pull ghcr.io/imputnet/cobalt:11
          docker run -d --name cobalt -p 9000:9000 -e API_URL=http://127.0.0.1:9000/ ghcr.io/imputnet/cobalt:11
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/ > cobalt-info.json; then break; fi
            sleep 1
          done
          cat cobalt-info.json
      - name: Download confirmed Episode 1
        run: |
          set -euo pipefail
          VIDEO='https://www.tiktok.com/@muffindrama_us/video/7682997000391904526'
          curl -fsS -X POST http://127.0.0.1:9000/ \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data "{\"url\":\"$VIDEO\",\"downloadMode\":\"auto\",\"videoQuality\":\"1080\",\"allowH265\":false,\"alwaysProxy\":true}" \
            -o cobalt-response.json
          cat cobalt-response.json
          python - <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          with open('cobalt-response.json','r',encoding='utf-8') as f: d=json.load(f)
          print('STATUS',d.get('status'))
          if d.get('status')=='error': raise SystemExit(json.dumps(d))
          url=d.get('url')
          if not url and d.get('status')=='picker':
              for x in d.get('picker') or []:
                  if x.get('type')=='video' and x.get('url'):
                      url=x['url']; break
          if not url: raise SystemExit('Cobalt returned no downloadable video URL')
          url=urllib.parse.urljoin('http://127.0.0.1:9000/',url)
          print('MEDIA_URL',url)
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=180) as r, open('episode1.mp4','wb') as out:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  out.write(b)
          size=os.path.getsize('episode1.mp4')
          print('DOWNLOADED_BYTES',size)
          if size<100000: raise SystemExit('Downloaded file is unexpectedly small')
          PY
      - name: Verify video
        run: |
          ffprobe -v error -show_entries format=duration,size -of json episode1.mp4
      - name: Upload Episode 1
        uses: actions/upload-artifact@v4
        with:
          name: muffindrama-episode1
          path: episode1.mp4
          retention-days: 1
      - name: Cobalt logs on failure
        if: failure()
        run: docker logs cobalt || true
