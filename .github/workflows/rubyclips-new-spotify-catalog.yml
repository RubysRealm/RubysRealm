name: RubyClips new Spotify catalog probe
on:
  push:
    paths:
      - 'rubyclips/new_spotify_catalog.trigger'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --upgrade votify
      - run: python rubyclips/probe_new_spotify_catalog.py
