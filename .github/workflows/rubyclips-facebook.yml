name: RubyClips existing Facebook videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rubyclips/facebook_pipeline.py'
      - 'rubyclips/facebook_requirements.txt'
      - 'api/rubyclips-post.js'
      - '.github/workflows/rubyclips-facebook.yml'
  schedule:
    - cron: '15 1,7,13,19 * * *'

permissions:
  contents: write

concurrency:
  group: rubyclips-facebook-pipeline
  cancel-in-progress: true

jobs:
  upload-next-oldest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Facebook source tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r rubyclips/facebook_requirements.txt
          python -m playwright install chromium --with-deps

      - name: Find and download oldest unposted Facebook video
        run: |
          set -euo pipefail
          python rubyclips/facebook_pipeline.py

      - name: Stop cleanly when Facebook backlog is complete
        id: backlog
        run: |
          if [ -f rubyclips/facebook_output/complete.json ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "All discovered Facebook videos have been handled."
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read source video identity
        if: steps.backlog.outputs.complete != 'true'
        id: source
        run: |
          python - <<'PY'
          import json, os
          m=json.load(open('rubyclips/facebook_output/manifest.json'))
          vid=str(m['sourceVideoId'])
          if not vid.isdigit(): raise SystemExit('invalid Facebook video id')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'video_id={vid}\n')
              f.write(f'file={m["file"]}\n')
              f.write(f'segment_index={int(m.get("segmentIndex",1))}\n')
              f.write(f'segment_total={int(m.get("segmentTotal",1))}\n')
          PY

      - name: Publish immutable source release
        if: steps.backlog.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO_ID: ${{ steps.source.outputs.video_id }}
          FILE_NAME: ${{ steps.source.outputs.file }}
          SEGMENT_INDEX: ${{ steps.source.outputs.segment_index }}
          SEGMENT_TOTAL: ${{ steps.source.outputs.segment_total }}
        run: |
          set -euo pipefail
          if [ "$SEGMENT_TOTAL" -gt 1 ]; then
            TAG="rubyclips-fb-${VIDEO_ID}-s${SEGMENT_INDEX}"
          else
            TAG="rubyclips-fb-${VIDEO_ID}"
          fi
          echo "RUBYCLIPS_FB_TAG=$TAG" >> "$GITHUB_ENV"
          VIDEO="rubyclips/facebook_output/${FILE_NAME}"
          test -s "$VIDEO"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VIDEO" rubyclips/facebook_output/manifest.json --clobber
          else
            gh release create "$TAG" "$VIDEO" rubyclips/facebook_output/manifest.json --title "RubyClips Facebook ${VIDEO_ID} Part ${SEGMENT_INDEX}/${SEGMENT_TOTAL}" --notes "Existing user-provided Facebook footage. Divided only when the automatic TikTok duration limit requires it."
          fi

      - name: Wait for current RubyClips publisher deployment
        if: steps.backlog.outputs.complete != 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request
          url='https://rubys-realm.vercel.app/api/rubyclips-post?health=1'
          expected='facebook-existing-video-parts-v5'
          for _ in range(60):
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      d=json.loads(r.read().decode())
                  if d.get('ok') and d.get('version') == expected and str(d.get('channelName','')).lower() == 'rubaradaclips':
                      print('Publisher ready:', expected)
                      raise SystemExit(0)
              except Exception as exc:
                  print('Publisher not ready yet:', exc)
              time.sleep(10)
          raise SystemExit('RubyClips publisher did not deploy the expected version.')
          PY

      - name: Upload existing video to @rubaradaclips
        if: steps.backlog.outputs.complete != 'true'
        env:
          TAG: ${{ env.RUBYCLIPS_FB_TAG }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          tag=os.environ['TAG']
          url=f'https://rubys-realm.vercel.app/api/rubyclips-post?tag={tag}'
          last=None
          data=None
          for attempt in range(4):
              try:
                  with urllib.request.urlopen(url, timeout=90) as r:
                      data=json.loads(r.read().decode())
                  if not data.get('ok'):
                      raise RuntimeError(json.dumps(data))
                  if str(data.get('channelName','')).lstrip('@').lower()!='rubaradaclips':
                      raise RuntimeError('wrong TikTok channel: '+json.dumps(data))
                  break
              except urllib.error.HTTPError as exc:
                  body=exc.read().decode(errors='replace')
                  last=RuntimeError(f'HTTP {exc.code}: {body}')
                  print(f'publish attempt {attempt+1}: {last}')
                  if exc.code != 429:
                      raise SystemExit(f'publish failed: {last}')
                  retry=int(float(exc.headers.get('Retry-After') or 0))
                  if not retry:
                      try: retry=int(json.loads(body).get('retryAfter') or 0)
                      except Exception: retry=0
                  retry=max(60, retry)
                  if retry > 1200:
                      raise SystemExit(f'Buffer rate limit requires waiting {retry}s; stopping cleanly instead of hammering the API.')
                  print(f'Buffer asked us to wait {retry}s; honoring Retry-After.')
                  time.sleep(retry + 3)
              except Exception as exc:
                  last=exc
                  raise SystemExit(f'publish failed: {last}')
          else:
              raise SystemExit(f'publish failed: {last}')
          open('rubyclips/facebook_output/publish.json','w').write(json.dumps(data,indent=2))
          print(json.dumps(data,indent=2))
          PY

      - name: Confirm TikTok send completed
        if: steps.backlog.outputs.complete != 'true'
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error, urllib.parse
          created=json.load(open('rubyclips/facebook_output/publish.json'))
          post_id=str(created.get('postId') or '')
          if not post_id:
              raise SystemExit('Buffer did not return a RubyClips post id.')
          url='https://rubys-realm.vercel.app/api/buffer-status?post_id='+urllib.parse.quote(post_id)
          deadline=time.time()+1200
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      d=json.loads(r.read().decode())
                  post=d.get('post') or {}
                  status=str(post.get('status') or '').lower()
                  error=(post.get('error') or {}).get('message') if isinstance(post.get('error'),dict) else None
                  print('RubyClips Buffer status:', status, post.get('externalLink') or '')
                  if status == 'sent' and post.get('externalLink'):
                      out={'ok':True,'postId':post_id,'status':status,'externalLink':post['externalLink'],'sentAt':post.get('sentAt')}
                      open('rubyclips/facebook_output/confirmed.json','w').write(json.dumps(out,indent=2))
                      print(json.dumps(out,indent=2))
                      raise SystemExit(0)
                  if status in {'failed','error'} or error:
                      raise SystemExit('TikTok send failed: '+str(error or status))
                  time.sleep(60)
              except urllib.error.HTTPError as exc:
                  body=exc.read().decode(errors='replace')
                  if exc.code != 429:
                      raise SystemExit(f'TikTok status check failed HTTP {exc.code}: {body}')
                  retry=int(float(exc.headers.get('Retry-After') or 0))
                  if not retry:
                      try: retry=int(json.loads(body).get('retryAfter') or 0)
                      except Exception: retry=0
                  retry=max(60,retry)
                  if retry > 1200:
                      raise SystemExit(f'Buffer status rate limit requires waiting {retry}s; not marking the video posted.')
                  print(f'Status check rate-limited; honoring Retry-After {retry}s.')
                  time.sleep(retry + 3)
          raise SystemExit('TikTok post was created in Buffer but was not confirmed sent before timeout; state will not advance.')
          PY

      - name: Mark Facebook video or technical segment as posted
        if: steps.backlog.outputs.complete != 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          state_path=Path('rubyclips/facebook_state.json')
          manifest_path=Path('rubyclips/facebook_output/manifest.json')
          confirmed_path=Path('rubyclips/facebook_output/confirmed.json')
          if not confirmed_path.exists(): raise SystemExit('Refusing to advance state without a confirmed TikTok send.')
          state=json.loads(state_path.read_text())
          m=json.loads(manifest_path.read_text())
          vid=str(m['sourceVideoId'])
          idx=int(m.get('segmentIndex',1))
          total=int(m.get('segmentTotal',1))
          progress=state.setdefault('segmentProgress',{})
          if idx < total:
              progress[vid]=idx+1
          else:
              progress.pop(vid,None)
              posted=[str(x) for x in state.get('postedVideoIds',[])]
              if vid not in posted: posted.append(vid)
              state['postedVideoIds']=posted
          state['lastResolvedPageUrl']=m.get('resolvedPageUrl')
          state['lastPostedAt']=datetime.now(timezone.utc).isoformat()
          state_path.write_text(json.dumps(state,indent=2)+'\n')
          PY
          git config user.name "rubyclips-facebook-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase
          git add rubyclips/facebook_state.json
          git diff --cached --quiet || git commit -m "Advance RubyClips Facebook queue [skip ci]"
          git push

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubyclips-facebook-${{ github.run_number }}
          path: |
            rubyclips/facebook_output/manifest.json
            rubyclips/facebook_output/publish.json
            rubyclips/facebook_output/confirmed.json
            rubyclips/facebook_output/complete.json
          if-no-files-found: warn
          retention-days: 7
