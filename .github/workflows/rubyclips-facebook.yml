name: RubyClips existing Facebook videos

on:
  workflow_dispatch:
  schedule:
    - cron: '15 1,7,13,19 * * *'
  push:
    paths:
      - 'rubyclips/manual_publish_next_story.trigger'

permissions:
  contents: write

concurrency:
  group: rubyclips-facebook-pipeline
  cancel-in-progress: false

jobs:
  upload-next-oldest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Facebook source tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r rubyclips/facebook_requirements.txt
          python -m playwright install chromium --with-deps

      - name: Find and download oldest unposted Facebook video
        run: |
          set -euo pipefail
          python rubyclips/facebook_pipeline.py
          if [ -f rubyclips/facebook_output/complete.json ]; then
            echo "Primary Facebook route exposed no additional videos; trying broader page routes."
            rm -f rubyclips/facebook_output/complete.json
            python rubyclips/facebook_discovery_fallback.py
          fi

      - name: Stop cleanly when Facebook backlog is complete
        id: backlog
        run: |
          if [ -f rubyclips/facebook_output/complete.json ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "All discovered Facebook videos have been handled."
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read source video identity
        if: steps.backlog.outputs.complete != 'true'
        id: source
        run: |
          python - <<'PY'
          import json, os
          m=json.load(open('rubyclips/facebook_output/manifest.json'))
          vid=str(m['sourceVideoId'])
          if not vid.isdigit(): raise SystemExit('invalid Facebook video id')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'video_id={vid}\n')
              f.write(f'file={m["file"]}\n')
              f.write(f'segment_index={int(m.get("segmentIndex",1))}\n')
              f.write(f'segment_total={int(m.get("segmentTotal",1))}\n')
          PY

      - name: Guard immediate trigger as new-story Part 1
        if: steps.backlog.outputs.complete != 'true' && github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          m=json.load(open('rubyclips/facebook_output/manifest.json'))
          idx=int(m.get('segmentIndex',1))
          if idx != 1:
              raise SystemExit(f'Immediate trigger refused: expected new-story Part 1, got Part {idx}.')
          print(f'Immediate new-story trigger validated: source={m.get("sourceVideoId")}, Part 1/{m.get("segmentTotal",1)}')
          PY

      - name: Publish immutable source release
        if: steps.backlog.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO_ID: ${{ steps.source.outputs.video_id }}
          FILE_NAME: ${{ steps.source.outputs.file }}
          SEGMENT_INDEX: ${{ steps.source.outputs.segment_index }}
          SEGMENT_TOTAL: ${{ steps.source.outputs.segment_total }}
        run: |
          set -euo pipefail
          if [ "$SEGMENT_TOTAL" -gt 1 ]; then
            TAG="rubyclips-fb-${VIDEO_ID}-s${SEGMENT_INDEX}"
          else
            TAG="rubyclips-fb-${VIDEO_ID}"
          fi
          echo "RUBYCLIPS_FB_TAG=$TAG" >> "$GITHUB_ENV"
          VIDEO="rubyclips/facebook_output/${FILE_NAME}"
          test -s "$VIDEO"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VIDEO" rubyclips/facebook_output/manifest.json --clobber
          else
            gh release create "$TAG" "$VIDEO" rubyclips/facebook_output/manifest.json --title "RubyClips Facebook ${VIDEO_ID} Part ${SEGMENT_INDEX}/${SEGMENT_TOTAL}" --notes "Existing user-provided Facebook footage. Divided only when the automatic TikTok duration limit requires it."
          fi

      - name: Wait for RubyClips publisher endpoint
        if: steps.backlog.outputs.complete != 'true'
        run: |
          set -euo pipefail
          URL='https://rubys-realm.vercel.app/api/rubyclips-post?health=1'
          for i in $(seq 1 48); do
            CODE="$(curl -sS -o /tmp/rubyclips-probe.json -w '%{http_code}' "$URL" || true)"
            if [ "$CODE" = '200' ]; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/rubyclips-probe.json || true
          exit 1

      - name: Send next RubyClips part through Buffer once
        if: steps.backlog.outputs.complete != 'true'
        env:
          TAG: ${{ env.RUBYCLIPS_FB_TAG }}
        run: |
          set -euo pipefail
          URL="https://rubys-realm.vercel.app/api/rubyclips-post?tag=${TAG}"
          CODE="$(curl -sS --max-time 90 -o /tmp/rubyclips-post-response.json -w '%{http_code}' "$URL" || true)"
          cat /tmp/rubyclips-post-response.json || true
          if [ "$CODE" != '200' ]; then
            echo "RubyClips publisher was not accepted this cycle; state will not advance."
            exit 1
          fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/rubyclips-post-response.json'))
          if not d.get('ok') or not d.get('postId'):
              raise SystemExit('Buffer did not accept the RubyClips post.')
          if str(d.get('channelName','')).lstrip('@').lower()!='rubaradaclips':
              raise SystemExit('Wrong TikTok target returned by publisher.')
          open('rubyclips/facebook_output/publish.json','w').write(json.dumps(d,indent=2))
          print('Accepted by Buffer:', d['postId'])
          PY

      - name: Advance only after Buffer accepts the RubyClips post
        if: steps.backlog.outputs.complete != 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          state_path=Path('rubyclips/facebook_state.json')
          manifest_path=Path('rubyclips/facebook_output/manifest.json')
          publish_path=Path('rubyclips/facebook_output/publish.json')
          if not publish_path.exists(): raise SystemExit('Refusing to advance without Buffer acceptance.')
          accepted=json.loads(publish_path.read_text())
          if not accepted.get('ok') or not accepted.get('postId'):
              raise SystemExit('Refusing to advance without a valid Buffer post id.')
          state=json.loads(state_path.read_text())
          m=json.loads(manifest_path.read_text())
          vid=str(m['sourceVideoId'])
          idx=int(m.get('segmentIndex',1))
          total=int(m.get('segmentTotal',1))
          progress=state.setdefault('segmentProgress',{})
          if idx < total:
              progress[vid]=idx+1
          else:
              progress.pop(vid,None)
              posted=[str(x) for x in state.get('postedVideoIds',[])]
              if vid not in posted: posted.append(vid)
              state['postedVideoIds']=posted
          state['lastResolvedPageUrl']=m.get('resolvedPageUrl')
          state['lastPostedAt']=datetime.now(timezone.utc).isoformat()
          state['lastBufferPostId']=str(accepted['postId'])
          state_path.write_text(json.dumps(state,indent=2)+'\n')
          PY
          git config user.name "rubyclips-facebook-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase
          git add rubyclips/facebook_state.json
          git diff --cached --quiet || git commit -m "Advance RubyClips Facebook queue after Buffer acceptance [skip ci]"
          git push

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubyclips-facebook-${{ github.run_number }}
          path: |
            rubyclips/facebook_output/manifest.json
            rubyclips/facebook_output/publish.json
            rubyclips/facebook_output/complete.json
          if-no-files-found: warn
          retention-days: 7
