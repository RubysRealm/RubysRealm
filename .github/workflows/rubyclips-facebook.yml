name: RubyClips existing Facebook videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rubyclips/facebook_pipeline.py'
      - 'rubyclips/facebook_requirements.txt'
      - 'api/rubyclips-post.js'
      - '.github/workflows/rubyclips-facebook.yml'
  schedule:
    - cron: '15 1,7,13,19 * * *'

permissions:
  contents: write

concurrency:
  group: rubyclips-facebook-pipeline
  cancel-in-progress: true

jobs:
  upload-next-oldest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Facebook source tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r rubyclips/facebook_requirements.txt
          python -m playwright install chromium --with-deps

      - name: Find and download oldest unposted Facebook video
        run: |
          set -euo pipefail
          python rubyclips/facebook_pipeline.py

      - name: Stop cleanly when Facebook backlog is complete
        id: backlog
        run: |
          if [ -f rubyclips/facebook_output/complete.json ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "All discovered Facebook videos have been handled."
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read source video identity
        if: steps.backlog.outputs.complete != 'true'
        id: source
        run: |
          python - <<'PY'
          import json, os
          m=json.load(open('rubyclips/facebook_output/manifest.json'))
          vid=str(m['sourceVideoId'])
          if not vid.isdigit(): raise SystemExit('invalid Facebook video id')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'video_id={vid}\n')
              f.write(f'file={m["file"]}\n')
              f.write(f'segment_index={int(m.get("segmentIndex",1))}\n')
              f.write(f'segment_total={int(m.get("segmentTotal",1))}\n')
          PY

      - name: Publish immutable source release
        if: steps.backlog.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO_ID: ${{ steps.source.outputs.video_id }}
          FILE_NAME: ${{ steps.source.outputs.file }}
          SEGMENT_INDEX: ${{ steps.source.outputs.segment_index }}
          SEGMENT_TOTAL: ${{ steps.source.outputs.segment_total }}
        run: |
          set -euo pipefail
          if [ "$SEGMENT_TOTAL" -gt 1 ] && [ "$SEGMENT_INDEX" -gt 1 ]; then
            TAG="rubyclips-fb-${VIDEO_ID}-s${SEGMENT_INDEX}"
          else
            TAG="rubyclips-fb-${VIDEO_ID}"
          fi
          echo "RUBYCLIPS_FB_TAG=$TAG" >> "$GITHUB_ENV"
          VIDEO="rubyclips/facebook_output/${FILE_NAME}"
          test -s "$VIDEO"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VIDEO" rubyclips/facebook_output/manifest.json --clobber
          else
            gh release create "$TAG" "$VIDEO" rubyclips/facebook_output/manifest.json --title "RubyClips Facebook ${VIDEO_ID} Part ${SEGMENT_INDEX}/${SEGMENT_TOTAL}" --notes "Existing user-provided Facebook video. Split only when required by TikTok's upload duration limit."
          fi

      - name: Wait for low-request RubyClips publisher deployment
        if: steps.backlog.outputs.complete != 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            CODE="$(curl -sS -o /tmp/check.json -w '%{http_code}' 'https://rubys-realm.vercel.app/api/rubyclips-post?tag=invalid' || true)"
            if [ "$CODE" = "400" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "RubyClips publisher did not become ready."
          exit 1

      - name: Upload existing video to @rubaradaclips
        if: steps.backlog.outputs.complete != 'true'
        env:
          TAG: ${{ env.RUBYCLIPS_FB_TAG }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          tag=os.environ['TAG']
          url=f'https://rubys-realm.vercel.app/api/rubyclips-post?tag={tag}'
          last=None
          data=None
          for attempt in range(10):
              try:
                  with urllib.request.urlopen(url, timeout=90) as r:
                      data=json.loads(r.read().decode())
                  if not data.get('ok'):
                      raise RuntimeError(json.dumps(data))
                  if str(data.get('channelName','')).lstrip('@').lower()!='rubaradaclips':
                      raise RuntimeError('wrong TikTok channel: '+json.dumps(data))
                  break
              except urllib.error.HTTPError as exc:
                  body=exc.read().decode(errors='replace')
                  last=RuntimeError(f'HTTP {exc.code}: {body}')
                  print(f'publish attempt {attempt+1}: {last}')
                  if exc.code == 429:
                      time.sleep(120)
                  else:
                      time.sleep(30)
              except Exception as exc:
                  last=exc
                  print(f'publish attempt {attempt+1}: {exc}')
                  time.sleep(30)
          else:
              raise SystemExit(f'publish failed: {last}')
          open('rubyclips/facebook_output/publish.json','w').write(json.dumps(data,indent=2))
          print(json.dumps(data,indent=2))
          PY

      - name: Confirm TikTok send completed
        if: steps.backlog.outputs.complete != 'true'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('rubyclips/facebook_output/publish.json'))
          if not d.get('ok') or str(d.get('channelName','')).lower()!='rubaradaclips':
              raise SystemExit('RubyClips TikTok send was not confirmed')
          print('Confirmed RubyClips post', d.get('postId'))
          PY

      - name: Mark Facebook video or technical segment as posted
        if: steps.backlog.outputs.complete != 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          state_path=Path('rubyclips/facebook_state.json')
          manifest_path=Path('rubyclips/facebook_output/manifest.json')
          state=json.loads(state_path.read_text())
          m=json.loads(manifest_path.read_text())
          vid=str(m['sourceVideoId'])
          idx=int(m.get('segmentIndex',1))
          total=int(m.get('segmentTotal',1))
          progress=state.setdefault('segmentProgress',{})
          if idx < total:
              progress[vid]=idx+1
          else:
              progress.pop(vid,None)
              posted=[str(x) for x in state.get('postedVideoIds',[])]
              if vid not in posted: posted.append(vid)
              state['postedVideoIds']=posted
          state['lastResolvedPageUrl']=m.get('resolvedPageUrl')
          state['lastPostedAt']=datetime.now(timezone.utc).isoformat()
          state_path.write_text(json.dumps(state,indent=2)+'\n')
          PY
          git config user.name "rubyclips-facebook-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase
          git add rubyclips/facebook_state.json
          git diff --cached --quiet || git commit -m "Advance RubyClips Facebook queue [skip ci]"
          git push

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubyclips-facebook-${{ github.run_number }}
          path: |
            rubyclips/facebook_output/manifest.json
            rubyclips/facebook_output/publish.json
            rubyclips/facebook_output/complete.json
          if-no-files-found: warn
          retention-days: 7
