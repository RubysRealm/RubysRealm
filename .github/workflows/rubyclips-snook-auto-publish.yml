name: Rubarata Snook Spotify RSS automatic TikTok
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'rubyclips/snook_auto.trigger'
permissions:
  contents: write
concurrency:
  group: rubarata-snook-rss-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read latest durable state
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Respect six-hour cadence and oldest-first queue
        id: gate
        run: python3 rubyclips/snook_rss_pipeline.py check

      - name: Install video renderer
        if: steps.gate.outputs.allowed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Build exactly one next episode part
        if: steps.gate.outputs.allowed == 'true'
        run: python3 rubyclips/snook_rss_pipeline.py build

      - name: Create immutable GitHub release media
        if: steps.gate.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(python3 -c "import json;print(json.load(open('rubyclips/snook_output/part-info.json'))['releaseTag'])")
          NAME=$(python3 -c "import json;print(json.load(open('rubyclips/snook_output/manifest.json'))['file'])")
          VIDEO="rubyclips/snook_output/$NAME"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Reusing deterministic release $TAG; prevents duplicate media assets."
          else
            gh release create "$TAG" "$VIDEO" 'rubyclips/snook_output/manifest.json' \
              --title "Rubarata Snook story part" \
              --notes "Snook Spotify-linked official podcast RSS, chronological multipart conversion. Sent confirmation is required to advance."
          fi

      - name: Inspect existing publish attempt
        id: marker
        if: steps.gate.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rubarata-publish
          if gh release download "$RELEASE_TAG" --pattern publish.json --dir /tmp/rubarata-publish >/dev/null 2>&1; then
            cp /tmp/rubarata-publish/publish.json /tmp/post.json
            python3 - <<'PY'
          import json
          p=json.load(open('/tmp/post.json'))
          assert p.get('ok') and p.get('postId') and p.get('channelName')=='rubaradaclips'
          print('Reuse existing Buffer post:',p['postId'])
          PY
            echo 'already=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Snook-aware publisher deployment
        if: steps.gate.outputs.allowed == 'true' && steps.marker.outputs.already == 'false'
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' \
              'https://rubys-realm.vercel.app/api/rubyclips-post?health=1' || true)
            if [ "$code" = "200" ] && python3 - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True and d.get('channelName')=='rubaradaclips'
          assert 'snook-rss-v15' in str(d.get('version',''))
          PY
            then echo "Correct publisher is deployed"; exit 0; fi
            sleep 5
          done
          echo 'The Snook-aware publisher did not deploy; refusing a bad post.'
          cat /tmp/health.json || true
          exit 1

      - name: Send part to Buffer exactly once
        if: steps.gate.outputs.allowed == 'true' && steps.marker.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="https://rubys-realm.vercel.app/api/rubyclips-post?tag=$RELEASE_TAG"
          CODE=$(curl -sS --max-time 120 -o /tmp/post.json -w '%{http_code}' "$URL" || true)
          cat /tmp/post.json
          test "$CODE" = "200"
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/post.json'))
          assert p.get('ok') and p.get('postId')
          assert p.get('channelName')=='rubaradaclips'
          assert p.get('segmentIndex')>=1
          print('Buffer accepted:',p['postId'])
          PY
          cp /tmp/post.json /tmp/publish.json
          gh release upload "$RELEASE_TAG" /tmp/publish.json --clobber

      - name: Wait for confirmed TikTok video link
        if: steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          POST_ID=$(python3 -c "import json;print(json.load(open('/tmp/post.json'))['postId'])")
          for i in $(seq 1 72); do
            CODE=$(curl -sS --max-time 30 -o /tmp/status.json -w '%{http_code}' \
              "https://rubys-realm.vercel.app/api/buffer-status?post_id=$POST_ID" || true)
            if [ "$CODE" = "200" ]; then
              RC=0
              python3 - <<'PY' || RC=$?
          import json
          data=json.load(open('/tmp/status.json'))
          if data.get('ok') is not True: raise SystemExit(1)
          p=data.get('post') or {}
          if str((p.get('channel') or {}).get('id'))!='6a9f6ff1cd8b9c702c2897e1':
              print('Wrong TikTok channel'); raise SystemExit(2)
          err=p.get('error')
          if err:
              print('TikTok/Buffer rejected post:',err)
              raise SystemExit(2)
          status=str(p.get('status') or '').lower()
          print('Buffer state:',status)
          if status=='error': raise SystemExit(2)
          if status!='sent': raise SystemExit(1)
          link=str(p.get('externalLink') or '')
          if 'tiktok.com/@rubaradaclips/video/' not in link or not p.get('sentAt'):
              raise SystemExit(2)
          print('TIKTOK_CONFIRMED',link,p['sentAt'])
          PY
              if [ "$RC" -eq 0 ]; then
                cp /tmp/status.json rubyclips/snook_output/sent-status.json
                break
              fi
              if [ "$RC" -eq 2 ]; then
                echo 'Permanent post error: preserving queue without advancing to avoid missing any part.'
                exit 1
              fi
            fi
            if [ "$i" -eq 72 ]; then
              echo 'Timed out without a confirmed TikTok link; preserving the exact part for retry.'
              exit 1
            fi
            sleep 15
          done

      - name: Advance Snook episode only after confirmed send
        if: steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          python3 rubyclips/snook_rss_pipeline.py advance rubyclips/snook_output/sent-status.json
          git config user.name 'rubarata-publishing-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add rubyclips/snook_rss_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Rubarata Snook queue after verified TikTok send [skip ci]'
            git pull --rebase origin main
            git push
          fi

      - name: Keep concise diagnostics
        if: always() && steps.gate.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rubarata-snook-${{ github.run_number }}
          path: |
            rubyclips/snook_output/manifest.json
            rubyclips/snook_output/part-info.json
            rubyclips/snook_output/sent-status.json
          retention-days: 3
          if-no-files-found: warn
