name: RubyClips Spotify-Dailymotion source probe
on:
  push:
    paths:
      - 'rubyclips/dailymotion_probe.trigger'
      - 'rubyclips/spotify_dailymotion_probe.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install source tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade yt-dlp
      - name: Match current Spotify episode to Dailymotion and verify media
        run: python rubyclips/spotify_dailymotion_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rubyclips-spotify-dailymotion-probe
          path: |
            rubyclips/spotify_dailymotion_probe.json
            rubyclips/spotify_dailymotion_probe.mp4
          if-no-files-found: warn
          retention-days: 1
