name: RubyClips Dailymotion source probe
on:
  push:
    paths:
      - 'rubyclips/dailymotion_probe.trigger'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: python -m pip install --quiet --upgrade yt-dlp
      - name: Probe full-story source
        run: |
          yt-dlp --dump-single-json --no-playlist 'https://www.dailymotion.com/video/xb2tc0i' > rubyclips/dailymotion_probe.json
          python - <<'PY'
          import json
          d=json.load(open('rubyclips/dailymotion_probe.json'))
          print('TITLE=',d.get('title'))
          print('DURATION=',d.get('duration'))
          print('FORMATS=',len(d.get('formats',[])))
          for f in d.get('formats',[]):
              if f.get('vcodec')!='none': print(f.get('format_id'),f.get('height'),f.get('ext'),f.get('protocol'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rubyclips-dailymotion-probe
          path: rubyclips/dailymotion_probe.json
          if-no-files-found: warn
          retention-days: 1
