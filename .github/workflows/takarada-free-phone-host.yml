name: Takarada Free Phone Host

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: takarada-free-phone-host
  cancel-in-progress: true

jobs:
  phone:
    if: github.event_name != 'issues' || github.event.issue.title == 'START_TAKARADA_FREE_PHONE'
    runs-on: ubuntu-latest
    timeout-minutes: 335
    env:
      TAKARADA_FEED_URL: https://takarada-cloud-live.onrender.com/preview
      GH_TOKEN: ${{ github.token }}
      TRIGGER_ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Checkout isolated Takarada phone branch
        uses: actions/checkout@v4
        with:
          ref: takarada-virtual-phone

      - name: Enable KVM
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm || true
          fi

      - name: Install screenshot helper
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil curl

      - name: Restore Android phone state
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: takarada-phone-${{ github.run_id }}
          restore-keys: |
            takarada-phone-

      - name: Run Android virtual phone
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: bash virtual-phone/github-phone-agent.sh
