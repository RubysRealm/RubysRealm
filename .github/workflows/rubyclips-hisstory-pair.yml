name: RubyClips His Story paired source probe
on:
  push:
    paths:
      - 'rubyclips/hisstory_pair.trigger'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade yt-dlp
      - name: Verify official visual plus Spotify audio
        run: python rubyclips/probe_hisstory_pair.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hisstory-paired-source-proof
          path: rubyclips/hisstory_pair_probe/
          retention-days: 2
