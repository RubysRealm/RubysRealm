name: RubyClips Snook source verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'rubyclips/snook_probe.trigger'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check Snook podcast RSS media
        run: python3 rubyclips/snook_feed_probe.py
