name: Rubaradaclips TikTok catalog probe
on:
  push:
    paths:
      - '.github/workflows/rubyclips-tiktok-catalog-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        run: npm install --silent puppeteer @tobyg74/tiktok-api-dl
      - name: Inspect MuffinDrama story catalog
        run: |
          cat > /tmp/catalog-probe.cjs <<'JS'
          const puppeteer = require('puppeteer');
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          const profile='https://www.tiktok.com/@muffindrama_us';
          const known='https://www.tiktok.com/shortdrama/episode/7682993954661553173/1';
          function idsFrom(s){
            const out=[];
            for(const re of [
              /shortdrama\/episode\/(\d{10,25})\/(\d+)/gi,
              /["'](?:seriesId|series_id|dramaId|drama_id|shortDramaId|short_drama_id)["']\s*[:=]\s*["']?(\d{10,25})/gi,
              /@muffindrama_us\/video\/(\d{10,25})/gi,
              /[?&]item_id=(\d{10,25})/gi
            ]) for(const m of String(s||'').matchAll(re)) out.push(m.slice(1));
            return out;
          }
          (async()=>{
            const browser=await puppeteer.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--disable-blink-features=AutomationControlled']});
            const page=await browser.newPage();
            await page.setViewport({width:430,height:932,isMobile:true,hasTouch:true,deviceScaleFactor:2});
            await page.setUserAgent('Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1');
            await page.evaluateOnNewDocument(()=>Object.defineProperty(navigator,'webdriver',{get:()=>undefined}));
            const net=[];
            page.on('request',r=>{const u=r.url(); if(/shortdrama|aweme|muffindrama|item_id/i.test(u)) net.push(u)});
            await page.goto(profile,{waitUntil:'domcontentloaded',timeout:90000});
            await sleep(7000);
            for(let i=0;i<6;i++){await page.evaluate(()=>window.scrollBy(0,window.innerHeight*0.85)); await sleep(1200)}
            let snap=await page.evaluate(()=>({
              url:location.href,
              title:document.title,
              text:(document.body?.innerText||'').slice(0,12000),
              links:[...document.querySelectorAll('a[href]')].map(a=>({href:a.href,text:(a.innerText||a.textContent||'').trim().slice(0,180)})).filter(x=>/shortdrama|series|drama|episode/i.test(x.href+' '+x.text)).slice(0,250),
              buttons:[...document.querySelectorAll('button,[role="button"]')].map(x=>(x.innerText||x.textContent||'').trim()).filter(Boolean).filter(x=>/short|drama|series|episode/i.test(x)).slice(0,120),
              html:(document.documentElement?.outerHTML||'').slice(0,180000)
            }));
            console.log('PROFILE_URL',snap.url);
            console.log('PROFILE_TITLE',snap.title);
            console.log('PROFILE_LINKS',JSON.stringify(snap.links));
            console.log('PROFILE_BUTTONS',JSON.stringify(snap.buttons));
            console.log('PROFILE_IDS',JSON.stringify(idsFrom(snap.html).slice(0,300)));
            console.log('PROFILE_TEXT',JSON.stringify(snap.text.slice(0,5000)));
            console.log('PROFILE_NET',JSON.stringify([...new Set(net)].slice(-250)));

            const clicked=await page.evaluate(()=>{
              const els=[...document.querySelectorAll('button,[role="button"],a,div')];
              const x=els.find(e=>/^(short\s*drama|drama|series|stories)$/i.test((e.innerText||e.textContent||'').trim()));
              if(x){x.click();return true} return false;
            }).catch(()=>false);
            if(clicked){await sleep(5000); snap=await page.evaluate(()=>({url:location.href,text:(document.body?.innerText||'').slice(0,10000),links:[...document.querySelectorAll('a[href]')].map(a=>({href:a.href,text:(a.innerText||a.textContent||'').trim().slice(0,180)})).filter(x=>/shortdrama|series|drama|episode/i.test(x.href+' '+x.text)).slice(0,250),html:(document.documentElement?.outerHTML||'').slice(0,180000)})); console.log('AFTER_TAB',JSON.stringify({url:snap.url,links:snap.links,ids:idsFrom(snap.html).slice(0,300),text:snap.text.slice(0,5000)}));}

            net.length=0;
            await page.goto(known,{waitUntil:'domcontentloaded',timeout:90000});
            await sleep(8000);
            const ep=await page.evaluate(()=>({
              url:location.href,
              title:document.title,
              text:(document.body?.innerText||'').slice(0,12000),
              nums:[...document.querySelectorAll('button,[role="button"],a')].map(x=>(x.innerText||x.textContent||'').trim()).filter(x=>/^\d{1,3}$/.test(x)).slice(0,300),
              links:[...document.querySelectorAll('a[href]')].map(a=>a.href).filter(x=>/shortdrama|muffindrama_us\/video|item_id/i.test(x)).slice(0,250),
              html:(document.documentElement?.outerHTML||'').slice(0,220000),
              scripts:[...document.scripts].map(s=>s.textContent||'').join('\n').slice(0,220000)
            }));
            console.log('EPISODE',JSON.stringify({url:ep.url,title:ep.title,nums:ep.nums,links:ep.links,ids:idsFrom(ep.html+'\n'+ep.scripts).slice(0,350),text:ep.text.slice(0,7000)}));
            console.log('EPISODE_NET',JSON.stringify([...new Set(net)].slice(-300)));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/catalog-probe.cjs
