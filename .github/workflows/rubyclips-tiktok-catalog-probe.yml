name: Rubaradaclips TikTok catalog probe
on:
  push:
    paths:
      - '.github/workflows/rubyclips-tiktok-catalog-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        run: npm install --silent puppeteer @tobyg74/tiktok-api-dl
      - name: Inspect MuffinDrama story catalog
        run: node rubyclips/muffin_catalog_probe.cjs
