# Legacy renderer intentionally disabled.
# The previous photoreal-human-v1 pipeline created still-image voiceover videos,
# which no longer meet Ruby's Realm publishing requirements.
name: Legacy Ruby's Realm Story Renderer (Disabled)

on:
  workflow_dispatch:

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Block obsolete renderer
        run: |
          echo "photoreal-human-v1 is retired: fully animated scene-based video is required."
          exit 1
