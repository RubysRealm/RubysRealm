name: Render Ruby's Realm Long Stories

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-long-stories.yml'
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: write

concurrency:
  group: rubys-realm-daily-render
  cancel-in-progress: false

jobs:
  render-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render six long-form stories
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(date -u +%F)"
          mkdir -p rendered
          BASE="https://rubys-realm.vercel.app/api/story-video"

          render_slot() {
            local slot="$1"
            local url="${BASE}?seed=${DAY}-slot-${slot}"
            echo "Rendering slot ${slot}: ${url}"
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 300 \
              --dump-header "rendered/slot-${slot}.headers" \
              "$url" -o "rendered/slot-${slot}.mp4"
          }

          for slot in 1 2 3; do render_slot "$slot" & done
          wait
          for slot in 4 5 6; do render_slot "$slot" & done
          wait

          echo "DAY=${DAY}" >> "$GITHUB_ENV"

      - name: Verify actual durations and build manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          day = os.environ['DAY']
          slots = []
          for slot in range(1, 7):
              header_path = f'rendered/slot-{slot}.headers'
              with open(header_path, 'r', encoding='utf-8', errors='replace') as f:
                  headers = f.read()
              matches = re.findall(r'(?im)^x-rubys-realm-duration:\s*([0-9.]+)\s*$', headers)
              if not matches:
                  raise SystemExit(f'slot {slot} did not return X-Rubys-Realm-Duration')
              duration = float(matches[-1])
              if duration < 120 or duration > 540:
                  raise SystemExit(f'slot {slot} duration {duration:.2f}s is outside the required 120-540 second range')
              slots.append({
                  'slot': slot,
                  'seed': f'{day}-slot-{slot}',
                  'durationSeconds': round(duration, 2),
                  'file': f'slot-{slot}.mp4'
              })
          manifest = {'day': day, 'durationRangeSeconds': [120, 540], 'slots': slots}
          with open('rendered/manifest.json','w',encoding='utf-8') as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish static MP4 release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="stories-${DAY}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Ruby's Realm Stories ${DAY}" --notes "Automated long-form TikTok story renders for ${DAY}."
          fi
          gh release upload "$TAG" rendered/manifest.json rendered/slot-1.mp4 rendered/slot-2.mp4 rendered/slot-3.mp4 rendered/slot-4.mp4 rendered/slot-5.mp4 rendered/slot-6.mp4 --clobber

      - name: Schedule verified stories to TikTok
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            "https://rubys-realm.vercel.app/api/rebuild-long-queue-8d441a7f?mode=rebuild"
