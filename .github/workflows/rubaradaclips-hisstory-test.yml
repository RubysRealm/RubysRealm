name: Rubarataclips His Story build verification
on:
  push:
    paths:
      - 'rubaradaclips_repurpose/test.trigger'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --quiet --upgrade yt-dlp
      - name: Build oldest His Story episode
        run: python3 rubaradaclips_repurpose/pipeline.py build
      - name: Reverify source separation and final motion
        run: |
          python3 - <<'PY'
          import json,subprocess,hashlib
          from pathlib import Path
          m=json.load(open('rubaradaclips_repurpose/output/manifest.json'))
          i=json.load(open('rubaradaclips_repurpose/output/part-info.json'))
          assert m['sourceProvider']=='hisstory-spotify-rss'
          assert m['spotifyShowId']=='6alyG1Jw4KH03mXZlYtPkf'
          assert m['transportProvider']=='facebook-official-hisstory-video-only'
          assert m['transportAudioUsed'] is False
          assert m['sourceSeriesTitle']=='His Mom Made Him Kneel On Broken Glass'
          assert i['part']==1 and i['totalParts']==1
          p=Path('rubaradaclips_repurpose/output')/m['file']
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)],text=True))
          v=[x for x in d['streams'] if x['codec_type']=='video'];a=[x for x in d['streams'] if x['codec_type']=='audio']
          assert len(v)==1 and len(a)==1
          assert v[0]['codec_name']=='h264' and a[0]['codec_name']=='aac'
          assert (int(v[0]['width']),int(v[0]['height']))==(1080,1920)
          dur=float(d['format']['duration'])
          assert 160<dur<175
          print('CLEAN_BUILD_OK',m['file'],dur,d['format']['size'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rubaradaclips-hisstory-clean-build
          path: rubaradaclips_repurpose/output/
          retention-days: 2
