name: RubyClips MuffinDrama hourly story

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'rubyclips/muffin_hourly.trigger'

permissions:
  contents: write
  actions: write

concurrency:
  group: rubyclips-muffindrama-hourly-r2
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest queue state
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Enforce Rubarataclips continuous queue
        id: cadence
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads(Path('rubyclips/muffin_state.json').read_text())
          key=f"rubyclips:{s.get('currentSeriesId')}:r{s.get('restartGeneration')}:p{s.get('nextPart')}"
          blocked=str(s.get('blockedLogicalPostKey') or '')
          allowed = blocked != key
          with open(os.environ['GITHUB_OUTPUT'],'a') as fh:
              fh.write(f"allowed={'true' if allowed else 'false'}\n")
          if allowed:
              print('Rubarataclips continuous mode: queue iteration allowed.')
          else:
              print(f"Rubarataclips paused on TikTok-moderated part: {key}")
              print(str(s.get('blockedReason') or 'TikTok moderation block'))
          PY

      - name: Validate Rubarataclips pipeline scripts
        if: steps.cadence.outputs.allowed == 'true'
        run: |
          python3 -m py_compile \
            rubyclips/spotify_story_sync.py \
            rubyclips/spotify_story_resolve.py \
            rubyclips/muffin_story_build.py

      - name: Set up Spotify queue client
        if: steps.cadence.outputs.allowed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Spotify queue client
        if: steps.cadence.outputs.allowed == 'true'
        run: python -m pip install --quiet --upgrade votify

      - name: Sync Spotify source catalog oldest to newest
        if: steps.cadence.outputs.allowed == 'true'
        run: python3 rubyclips/spotify_story_sync.py

      - name: Check story state
        id: state
        if: steps.cadence.outputs.allowed == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          s=json.load(open('rubyclips/muffin_state.json'))
          provider=str(s.get('sourceProvider','')).lower()
          complete=bool(s.get('currentSeriesComplete'))
          if provider == 'spotify-show':
              ready = not complete
          elif provider == 'dailymotion-muffindrama-mirror' and complete:
              ready = False
          else:
              ready = complete or int(s.get('nextEpisode',1)) <= int(s.get('currentSeriesEpisodeCount',1))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"ready={'true' if ready else 'false'}\n")
              f.write(f"next_episode={s.get('nextEpisode',1)}\n")
              f.write(f"next_part={s.get('nextPart',1)}\n")
              f.write(f"restart_generation={s.get('restartGeneration',0)}\n")
          print(f"Story={s.get('currentSeriesTitle')} source={s.get('sourceProvider','legacy')} complete={s.get('currentSeriesComplete')} next episode={s.get('nextEpisode')} next part={s.get('nextPart')} ready={ready}")
          PY

      - uses: actions/setup-python@v5
        if: steps.state.outputs.ready == 'true'
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        if: steps.state.outputs.ready == 'true'
        with:
          node-version: '22'

      - name: Install video tools
        if: steps.state.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --quiet --upgrade pip yt-dlp votify

      - name: Resolve next BabyJamie Spotify part
        if: steps.state.outputs.ready == 'true'
        run: |
          set -euo pipefail
          echo 'Using the BabyJamie Spotify show as the Rubaradaclips source.'
          python rubyclips/spotify_story_resolve.py

      - name: Build and verify corrected part
        if: steps.state.outputs.ready == 'true'
        run: python rubyclips/muffin_story_build.py

      - name: Publish restart release
        if: steps.state.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SERIES_ID="$(python -c "import json; print(json.load(open('rubyclips/muffin_output/manifest.json'))['sourceSeriesId'])")"
          RESTART="$(python -c "import json; print(json.load(open('rubyclips/muffin_output/manifest.json'))['restartGeneration'])")"
          PART="$(python -c "import json; print(json.load(open('rubyclips/muffin_output/manifest.json'))['segmentIndex'])")"
          VIDEO_NAME="$(python -c "import json; print(json.load(open('rubyclips/muffin_output/manifest.json'))['file'])")"
          TAG="rubyclips-tt-${SERIES_ID}-r${RESTART}-p${PART}"
          VIDEO="rubyclips/muffin_output/${VIDEO_NAME}"
          MANIFEST='rubyclips/muffin_output/manifest.json'
          echo "$TAG" > /tmp/rubyclips_tag
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VIDEO" "$MANIFEST" --clobber
          else
            gh release create "$TAG" "$VIDEO" "$MANIFEST" --title "RubyClips story Part ${PART}" --notes "Authorized source, normalized A/V, Part X of Y overlay, idempotent publishing."
          fi

      - name: Check durable publish marker
        id: publish_marker
        if: steps.state.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(cat /tmp/rubyclips_tag)"
          rm -rf /tmp/existing-publish
          mkdir -p /tmp/existing-publish
          if ! gh release download "$TAG" --pattern publish.json --dir /tmp/existing-publish >/dev/null 2>&1; then
            echo 'already=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp /tmp/existing-publish/publish.json /tmp/post.json
          POST_ID="$(python -c "import json; d=json.load(open('/tmp/post.json')); assert d.get('ok') and d.get('postId'); print(d['postId'])")"
          CODE="$(curl -sS --max-time 30 -o /tmp/existing-status.json -w '%{http_code}' "https://rubys-realm.vercel.app/api/buffer-status?post_id=${POST_ID}" || true)"

          if [ "$CODE" != '200' ]; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
            echo 'Existing publish marker found; Buffer status is temporarily unavailable, so reuse it safely.'
            exit 0
          fi

          STATUS="$(python -c "import json; print(str((json.load(open('/tmp/existing-status.json')).get('post') or {}).get('status','')).lower())")"
          if [ "$STATUS" = 'sent' ] || [ "$STATUS" = 'scheduled' ] || [ "$STATUS" = 'sending' ]; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
            echo "Existing Buffer post is $STATUS; reusing it."
            exit 0
          fi

          if [ "$STATUS" = 'error' ]; then
            OLD_TEXT="$(python -c "import json; print(str((json.load(open('/tmp/existing-status.json')).get('post') or {}).get('text','')))")"
            OLD_ERROR="$(python -c "import json; print(str(((json.load(open('/tmp/existing-status.json')).get('post') or {}).get('error') or {}).get('message','')))")"
            echo "Existing Buffer/TikTok post failed: $OLD_ERROR"

            # One remediation retry is allowed only for the legacy caption that had
            # auto-added generic trending hashtags. Cleaned posts are never loop-retried.
            if printf '%s' "$OLD_TEXT" | grep -Eqi '#fyp|#viral'; then
              echo 'Legacy generic hashtags detected; removing stale failed marker for one cleaned retry.'
              curl -sS --max-time 30 "https://rubys-realm.vercel.app/api/buffer-status?delete_post_id=${POST_ID}" || true
              gh release delete-asset "$TAG" publish.json -y || true
              rm -f /tmp/post.json
              echo 'already=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo 'Cleaned post was also blocked; refusing repeated automatic retries.'
            cat /tmp/existing-status.json
            exit 1
          fi

          echo 'already=true' >> "$GITHUB_OUTPUT"
          echo "Existing Buffer post has status '$STATUS'; reusing marker rather than duplicating."

      - name: Wait for idempotent publisher
        if: steps.state.outputs.ready == 'true' && steps.publish_marker.outputs.already != 'true'
        run: |
          URL='https://rubys-realm.vercel.app/api/rubyclips-post?health=1'
          for i in $(seq 1 90); do
            CODE="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$URL" || true)"
            if [ "$CODE" = '200' ] && python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/health.json'))
              assert d.get('ok') is True
              assert str(d.get('channelName','')).lstrip('@').lower() == 'rubaradaclips'
              assert 'continuous-no-trending' in str(d.get('version',''))
          except Exception:
              raise SystemExit(1)
          PY
            then exit 0; fi
            sleep 5
          done
          cat /tmp/health.json || true
          exit 1

      - name: Send part to Buffer once
        if: steps.state.outputs.ready == 'true' && steps.publish_marker.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(cat /tmp/rubyclips_tag)"
          URL="https://rubys-realm.vercel.app/api/rubyclips-post?tag=${TAG}"
          CODE="$(curl -sS --max-time 120 -o /tmp/post.json -w '%{http_code}' "$URL" || true)"
          cat /tmp/post.json
          test "$CODE" = '200'
          python -c "import json; d=json.load(open('/tmp/post.json')); assert d.get('ok') and d.get('postId') and str(d.get('channelName','')).lstrip('@').lower()=='rubaradaclips'"
          cp /tmp/post.json rubyclips/muffin_output/publish.json
          cp /tmp/post.json /tmp/publish.json
          gh release upload "$TAG" /tmp/publish.json --clobber

      - name: Restore existing publish result
        if: steps.state.outputs.ready == 'true' && steps.publish_marker.outputs.already == 'true'
        run: cp /tmp/post.json rubyclips/muffin_output/publish.json

      - name: Confirm Buffer sent part to TikTok
        if: steps.state.outputs.ready == 'true'
        run: |
          set -euo pipefail
          POST_ID="$(python -c "import json; print(json.load(open('rubyclips/muffin_output/publish.json'))['postId'])")"
          URL="https://rubys-realm.vercel.app/api/buffer-status?post_id=${POST_ID}"
          for i in $(seq 1 120); do
            CODE="$(curl -sS --max-time 30 -o /tmp/buffer-status.json -w '%{http_code}' "$URL" || true)"
            if [ "$CODE" = '200' ]; then
              RC=0
              python - <<'PY' || RC=$?
          import json
          d=json.load(open('/tmp/buffer-status.json'))
          if d.get('ok') is not True:
              raise SystemExit(1)
          p=d.get('post') or {}
          channel=p.get('channel') or {}
          if str(channel.get('id','')) != '6a9f6ff1cd8b9c702c2897e1':
              raise SystemExit(2)
          err=p.get('error')
          if err:
              print('Buffer/TikTok error:', err)
              raise SystemExit(2)
          status=str(p.get('status','')).lower()
          print('Buffer status:', status)
          if status != 'sent':
              raise SystemExit(1)
          link=str(p.get('externalLink') or '')
          sent_at=str(p.get('sentAt') or '')
          if not sent_at or 'tiktok.com/@rubaradaclips/video/' not in link:
              print('Sent status missing TikTok confirmation:', p)
              raise SystemExit(2)
          print('Confirmed TikTok send:', link, sent_at)
          PY
              if [ "$RC" -eq 0 ]; then
                cp /tmp/buffer-status.json rubyclips/muffin_output/sent-status.json
                exit 0
              fi
              if [ "$RC" -eq 2 ]; then
                cat /tmp/buffer-status.json
                exit 1
              fi
            fi
            sleep 15
          done
          echo 'Timed out waiting for Buffer to confirm the TikTok send.'
          cat /tmp/buffer-status.json || true
          exit 1

      - name: Record TikTok moderation block
        if: failure() && steps.state.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ ! -s rubyclips/muffin_output/publish.json ]; then
            exit 0
          fi
          POST_ID="$(python -c "import json; print(json.load(open('rubyclips/muffin_output/publish.json')).get('postId',''))" 2>/dev/null)"
          [ -n "$POST_ID" ] || exit 0
          curl -sS --max-time 30 -o /tmp/mod-status.json "https://rubys-realm.vercel.app/api/buffer-status?post_id=${POST_ID}" || exit 0
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          d=json.load(open('/tmp/mod-status.json'))
          post=d.get('post') or {}
          err=(post.get('error') or {}).get('message') or ''
          if 'potential spam' not in err.lower():
              raise SystemExit(0)
          p=Path('rubyclips/muffin_state.json')
          s=json.loads(p.read_text())
          key=f"rubyclips:{s.get('currentSeriesId')}:r{s.get('restartGeneration')}:p{s.get('nextPart')}"
          s['blockedLogicalPostKey']=key
          s['blockedReason']=err
          s['blockedAt']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(s,indent=2)+'\n')
          print('Recorded TikTok moderation block for', key)
          PY
          git config user.name 'rubyclips-publisher-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add rubyclips/muffin_state.json
          git diff --cached --quiet || git commit -m 'Pause Rubarataclips on TikTok moderation block [skip ci]'
          git push || true

      - name: Advance story state exactly once
        if: steps.state.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('rubyclips/muffin_state.json')
          s=json.loads(p.read_text())
          info=json.load(open('rubyclips/muffin_output/part-info.json'))
          sent=json.load(open('rubyclips/muffin_output/sent-status.json'))
          post=sent.get('post') or {}
          sent_at=str(post.get('sentAt') or '').strip()
          if not sent_at:
              raise SystemExit('Refusing to advance without confirmed TikTok sentAt timestamp')
          total=info.get('totalParts')
          if total:
              s['currentSeriesEpisodeCount']=int(total)
              s['storyTotalParts']=int(total)
          if int(s.get('restartGeneration',0)) != int(info.get('restartGeneration',-1)):
              raise SystemExit('Refusing to advance stale restart generation')
          part=int(info['part'])
          episodes=[int(x) for x in info['episodes']]
          first_episode=episodes[0]
          next_episode=int(info['nextEpisode'])
          if int(s.get('nextPart',0)) == part + 1 and int(s.get('nextEpisode',0)) == next_episode:
              print('Queue state was already advanced for this part; leaving it unchanged.')
              raise SystemExit(0)
          if int(s.get('nextPart',0)) != part or int(s.get('nextEpisode',0)) != first_episode:
              raise SystemExit(f"Refusing out-of-order state advance: state part={s.get('nextPart')} episode={s.get('nextEpisode')} built part={part} episode={first_episode}")
          s['lastPostedPart']=part
          s['lastPostedEpisodes']=episodes
          s['nextEpisode']=next_episode
          s['nextPart']=part+1
          s['lastPackingPolicy']='max-whole-episodes-under-595s'
          s['concatPolicy']='normalized-filter-concat-v2'
          s['overlayLayoutVersion']='story-title-lowered-v5-wide-frame-title-card'
          s['lastStoryHashtag']=info.get('storyHashtag')
          s['pipelineRevision']=info.get('pipelineRevision')
          s['lastLogicalPostKey']=info.get('logicalPostKey')
          s['lastPostAt']=sent_at
          s.pop('blockedLogicalPostKey', None)
          s.pop('blockedReason', None)
          s.pop('blockedAt', None)
          continuation_path=Path('rubyclips/muffin_work/continuation.json')
          if continuation_path.exists():
              continuation=json.loads(continuation_path.read_text())
              transport_url=str(continuation.get('mediaTransportUrl') or '').strip()
              transport_id=str(continuation.get('mediaTransportVideoId') or '').strip()
              if transport_url.startswith('https://www.facebook.com/'):
                  s['transportProvider']='facebook-public-copy'
                  s['transportUrl']=transport_url
                  s['transportVideoId']=transport_id
              elif transport_url:
                  s['transportProvider']='creator-public-copy'
                  s['transportUrl']=transport_url
                  s['transportVideoId']=transport_id
              full_duration=continuation.get('fullDurationSeconds')
              if full_duration:
                  s['sourceDurationSeconds']=float(full_duration)
          if info.get('storyComplete'):
              sid=str(s['currentSeriesId'])
              done=[str(x) for x in s.get('completedSeriesIds',[])]
              if sid not in done: done.append(sid)
              s['completedSeriesIds']=done
              s['currentSeriesComplete']=True
          p.write_text(json.dumps(s,indent=2)+'\n')
          PY
          git config user.name 'rubyclips-publisher-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add rubyclips/muffin_state.json rubyclips/spotify_episode_queue.json
          git diff --cached --quiet || git commit -m 'Advance Rubaradaclips story queue [skip ci]'
          git push

      - name: Continue Rubarataclips queue immediately
        if: steps.state.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'Launching the next Rubarataclips queue iteration immediately.'
          gh workflow run rubyclips-muffin-part1.yml --ref main

      - name: Save diagnostics
        if: always() && steps.state.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rubyclips-muffindrama-${{ github.run_number }}
          path: |
            rubyclips/muffin_output/manifest.json
            rubyclips/muffin_output/part-info.json
            rubyclips/muffin_output/publish.json
            rubyclips/muffin_output/sent-status.json
            rubyclips/muffin_work/episodes.json
            rubyclips/muffin_work/selected.json
          if-no-files-found: warn
          retention-days: 2
