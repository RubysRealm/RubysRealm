name: Three-channel owned promotion engine

on:
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'

permissions:
  contents: write

concurrency:
  group: three-channel-owned-promotion
  cancel-in-progress: true

jobs:
  promote-owned-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Build current source-video catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p promotion
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > promotion/releases.json

      - name: Cross-promote eligible owned videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf promotion/work promotion/output
          mkdir -p promotion/work promotion/output
          python promotion/launcher.py

      - name: Persist deduplication and cooldown state
        if: success()
        run: |
          set -euo pipefail
          git config user.name "rubysrealm-promotion-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase
          git add promotion/state.json
          git diff --cached --quiet || git commit -m "Advance owned-channel promotion state [skip ci]"
          git push

      - name: Save promotion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-promotion-${{ github.run_number }}
          path: |
            promotion/state.json
            promotion/output/**/manifest.json
          if-no-files-found: warn
          retention-days: 7
