name: RubyClips new Spotify native video probe
on:
  push:
    paths:
      - 'rubyclips/new_spotify_probe.trigger'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade votify
      - name: Probe native Spotify video
        run: python rubyclips/probe_new_spotify_show.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rubyclips-new-spotify-native-probe
          path: rubyclips/new_spotify_probe/
          retention-days: 2
