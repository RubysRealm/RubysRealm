name: Meta Facebook permission diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - 'viral_facebook/meta_diag.trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect token identity and managed Pages
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -u

          echo 'TOKEN_IDENTITY:'
          curl -sS -G \
            --data-urlencode 'fields=id,name' \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            'https://graph.facebook.com/v26.0/me' || true
          echo

          echo 'TOKEN_PERMISSIONS:'
          curl -sS -G \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            'https://graph.facebook.com/v26.0/me/permissions' || true
          echo

          curl -sS -G \
            --data-urlencode 'fields=id,name,tasks' \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            'https://graph.facebook.com/v26.0/me/accounts' > /tmp/accounts.json || true

          echo 'MANAGED_PAGES:'
          python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/accounts.json'))
          except Exception as e:
              print({'parse_error': str(e)})
              raise SystemExit
          if d.get('error'):
              print(json.dumps({'error': d['error']}, indent=2))
          else:
              rows=[]
              for x in d.get('data') or []:
                  rows.append({'id':x.get('id'),'name':x.get('name'),'tasks':x.get('tasks')})
              print(json.dumps({'data':rows},indent=2))
          PY
