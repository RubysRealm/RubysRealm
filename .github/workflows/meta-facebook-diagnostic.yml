name: Meta Facebook permission diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - 'viral_facebook/meta_diag.trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Page publishing capabilities
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -u

          curl -sS -G \
            --data-urlencode 'fields=id,name' \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            'https://graph.facebook.com/v26.0/me' > /tmp/me.json
          echo 'IDENTITY:'; cat /tmp/me.json; echo

          PAGE_ID="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/me.json'))
          print(d.get('id') or '')
          PY
          )"
          test -n "$PAGE_ID" || exit 1

          echo 'PERMISSIONS:'
          curl -sS -G \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            'https://graph.facebook.com/v26.0/me/permissions' || true
          echo

          for FIELD in category fan_count is_published link username; do
            echo "PAGE_FIELD_${FIELD}:"
            curl -sS -G \
              --data-urlencode "fields=${FIELD}" \
              --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
              "https://graph.facebook.com/v26.0/${PAGE_ID}" || true
            echo
          done

          echo 'FEED_READ_TEST:'
          curl -sS -G \
            --data-urlencode 'limit=1' \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            "https://graph.facebook.com/v26.0/${PAGE_ID}/feed" || true
          echo

          echo 'CREATE_CONTENT_TEST_UNPUBLISHED_FEED:'
          FEED_CODE="$(curl -sS -o /tmp/feed-create.json -w '%{http_code}' -X POST \
            "https://graph.facebook.com/v26.0/${PAGE_ID}/feed" \
            --data-urlencode 'message=Ruby Realm API capability test' \
            --data-urlencode 'published=false' \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}")"
          echo "Feed create HTTP status: ${FEED_CODE}"
          cat /tmp/feed-create.json; echo

          POST_ID="$(python - <<'PY'
          import json
          try: d=json.load(open('/tmp/feed-create.json'))
          except Exception: d={}
          print(d.get('id') or '')
          PY
          )"
          if [ -n "$POST_ID" ]; then
            echo 'CLEANUP_TEST_POST:'
            curl -sS -X DELETE \
              --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
              "https://graph.facebook.com/v26.0/${POST_ID}" || true
            echo
          fi

          echo 'REELS_START_TEST:'
          curl -sS -X POST \
            "https://graph.facebook.com/v26.0/${PAGE_ID}/video_reels" \
            --data-urlencode 'upload_phase=start' \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" || true
          echo
