name: Autonomous rights-clear Facebook videos

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0,6,12,18 * * *'
  push:
    paths:
      - 'viral_facebook/manual.trigger'

permissions:
  contents: write

concurrency:
  group: viral-facebook-autonomous
  cancel-in-progress: false

jobs:
  publish-next-facebook-part:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Facebook authorization
        id: auth
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -n "${FACEBOOK_PAGE_ACCESS_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Facebook authorization is present."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Facebook authorization is not configured yet; leaving the working TikTok/YouTube jobs untouched."
          fi

      - name: Set up Python
        if: steps.auth.outputs.ready == 'true' || github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install video tools
        if: steps.auth.outputs.ready == 'true' || github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Select viral source and render clean video
        if: steps.auth.outputs.ready == 'true' || github.event_name == 'push'
        env:
          FB_PART_TARGET_SECONDS: '75'
          FB_PART_MAX_SECONDS: '90'
          FB_MIN_SOURCE_SECONDS: '12'
          FB_MAX_SOURCE_SECONDS: '1200'
          FB_MIN_VIRAL_DOWNLOADS: '10000'
          FB_TREND_MIN_DOWNLOADS: '1000'
          FB_MIN_SOURCE_SHORT_SIDE: '360'
          FB_MIN_SOURCE_LONG_SIDE: '640'
          FB_MIN_SOURCE_BYTES_PER_SECOND: '45000'
        run: python viral_facebook/facebook_pipeline.py

      - name: Resolve Facebook Page identity
        if: steps.auth.outputs.ready == 'true'
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -G \
            --data-urlencode "fields=id,name" \
            --data-urlencode "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            "https://graph.facebook.com/v26.0/me" > /tmp/facebook-page.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/facebook-page.json'))
          page_id=str(d.get('id') or '').strip()
          page_name=str(d.get('name') or '').strip()
          if not page_id:
              raise SystemExit(f'Facebook Page token did not resolve a Page id: {d}')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'FACEBOOK_PAGE_ID={page_id}\n')
              f.write(f'FACEBOOK_PAGE_NAME={page_name}\n')
          print('Facebook Page authorized:', page_name or page_id)
          PY

      - name: Publish Reel directly to Facebook
        if: steps.auth.outputs.ready == 'true'
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          VIDEO="$(find viral_facebook/output -maxdepth 1 -name '*.mp4' -print -quit)"
          test -n "$VIDEO"
          FILE_SIZE="$(stat -c%s "$VIDEO")"

          python - <<'PY' > /tmp/facebook-description.txt
          import json
          m=json.load(open('viral_facebook/output/manifest.json'))
          print(str(m.get('postDescription') or m.get('title') or ''))
          PY
          DESCRIPTION="$(cat /tmp/facebook-description.txt)"

          START_CODE="$(curl -sS -o /tmp/facebook-start.json -w '%{http_code}' -X POST \
            "https://graph.facebook.com/v26.0/me/video_reels" \
            --form-string "upload_phase=start" \
            --form-string "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}")"
          echo "Facebook Reel start HTTP status: ${START_CODE}"
          cat /tmp/facebook-start.json
          export START_CODE
          python - <<'PY' > /tmp/facebook-reel-session.env
          import json, os
          d=json.load(open('/tmp/facebook-start.json'))
          code=int(os.environ.get('START_CODE') or 0)
          video_id=str(d.get('video_id') or '').strip()
          upload_url=str(d.get('upload_url') or '').strip()
          if code < 200 or code >= 300 or not video_id or not upload_url:
              raise SystemExit(f'Facebook Reel start failed (HTTP {code}): {d.get("error") or d}')
          print(f'VIDEO_ID={video_id}')
          print(f'UPLOAD_URL={upload_url}')
          PY
          source /tmp/facebook-reel-session.env

          UPLOAD_CODE="$(curl -sS -o /tmp/facebook-upload.json -w '%{http_code}' -X POST \
            "${UPLOAD_URL}" \
            -H "Authorization: OAuth ${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            -H "offset: 0" \
            -H "file_size: ${FILE_SIZE}" \
            --data-binary "@${VIDEO}")"
          echo "Facebook Reel upload HTTP status: ${UPLOAD_CODE}"
          cat /tmp/facebook-upload.json
          export UPLOAD_CODE
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/facebook-upload.json'))
          code=int(os.environ.get('UPLOAD_CODE') or 0)
          if code < 200 or code >= 300 or d.get('success') is not True:
              raise SystemExit(f'Facebook Reel binary upload failed (HTTP {code}): {d.get("error") or d}')
          PY

          FINISH_CODE="$(curl -sS -o /tmp/facebook-finish.json -w '%{http_code}' -X POST \
            "https://graph.facebook.com/v26.0/me/video_reels" \
            --form-string "upload_phase=finish" \
            --form-string "video_id=${VIDEO_ID}" \
            --form-string "video_state=PUBLISHED" \
            --form-string "description=${DESCRIPTION}" \
            --form-string "access_token=${FACEBOOK_PAGE_ACCESS_TOKEN}")"
          echo "Facebook Reel finish HTTP status: ${FINISH_CODE}"
          cat /tmp/facebook-finish.json
          export FINISH_CODE VIDEO_ID
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/facebook-finish.json'))
          code=int(os.environ.get('FINISH_CODE') or 0)
          video_id=str(os.environ.get('VIDEO_ID') or '').strip()
          if code < 200 or code >= 300 or d.get('success') is not True or not video_id:
              raise SystemExit(f'Facebook Reel publish failed (HTTP {code}): {d.get("error") or d}')
          with open('/tmp/facebook-publish.json','w') as f:
              json.dump({'id': video_id, 'success': True, 'finish': d}, f)
          print('Facebook accepted Reel:', video_id)
          PY

      - name: Advance Facebook queue only after acceptance
        if: steps.auth.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          state_path=Path('viral_facebook/state.json')
          state=json.loads(state_path.read_text()) if state_path.exists() else {'current':None,'completed':[],'rights_history':[]}
          state.setdefault('completed',[])
          state.setdefault('rights_history',[])
          manifest=json.loads(Path('viral_facebook/output/manifest.json').read_text())
          published=json.load(open('/tmp/facebook-publish.json'))
          video_id=str(published.get('id') or '').strip()
          if not video_id:
              raise SystemExit('Refusing to advance without Facebook acceptance.')
          key=str(manifest['sourceKey'])
          part=int(manifest['part'])
          total=int(manifest['totalParts'])
          current=state.get('current') or {}
          candidate=current.get('candidate') or {}
          if str(candidate.get('key') or '') != key:
              raise SystemExit('Facebook source lock mismatch; refusing to advance.')
          if not any(str(x.get('sourceKey') or '') == key for x in state['rights_history'] if isinstance(x,dict)):
              state['rights_history'].append({'sourceKey':key,'title':manifest.get('title'),'evidence':manifest.get('rightsEvidence')})
              state['rights_history']=state['rights_history'][-250:]
          if part >= total:
              done=[str(x) for x in state.get('completed') or []]
              if key not in done:
                  done.append(key)
              state['completed']=done[-1000:]
              state['current']=None
          else:
              current['next_part']=part+1
              current['total_parts']=total
              state['current']=current
          state['lastPost']={'sourceKey':key,'part':part,'totalParts':total,'facebookVideoId':video_id,'postedAt':datetime.now(timezone.utc).isoformat()}
          state_path.write_text(json.dumps(state,indent=2)+'\n')
          PY
          git config user.name "viral-facebook-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add viral_facebook/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Advance autonomous Facebook queue after accepted upload [skip ci]"
            git push
          fi

      - name: Save source and rights diagnostics
        if: always() && (steps.auth.outputs.ready == 'true' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: viral-facebook-${{ github.run_number }}
          path: |
            viral_facebook/output/manifest.json
            viral_facebook/output/rights-evidence.json
          if-no-files-found: warn
          retention-days: 30
