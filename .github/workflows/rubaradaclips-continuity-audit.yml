name: Rubarata unattended continuity audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rubaradaclips-continuity-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Inspect actual scheduler and recent automatic runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: RubysRealm/RubysRealm
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          def get(endpoint):
              p = subprocess.run(['gh','api',endpoint], text=True, capture_output=True, check=True)
              return json.loads(p.stdout)
          repo = 'repos/RubysRealm/RubysRealm'
          workflows = []
          for name in ['rubaradaclips-hisstory.yml','podcast-repurpose.yml','social-bot.yml']:
              meta = get(f'{repo}/actions/workflows/{name}')
              rows = get(f'{repo}/actions/workflows/{name}/runs?event=schedule&per_page=5')['workflow_runs']
              workflows.append({'file':name, 'state':meta['state'], 'workflowId':meta['id'], 'scheduledRuns':[
                  {k:row.get(k) for k in ('id','created_at','event','status','conclusion','head_sha','html_url')} for row in rows]})
          state=json.loads(Path('rubaradaclips_repurpose/state.json').read_text())
          catalog=json.loads(Path('rubyclips/spotify_video_catalog.json').read_text())
          next_at=datetime.fromisoformat(state['last_post_at'].replace('Z','+00:00'))+timedelta(hours=6)
          remaining=[r for r in catalog['episodes'] if r.get('rssGuid') not in state['completed']]
          evidence={'checkedAt':datetime.now(timezone.utc).isoformat(), 'workflows':workflows,
              'hold':state.get('hold'), 'pending':bool(state.get('pending')), 'current':state.get('current'),
              'nextEligibleEastern':next_at.astimezone(ZoneInfo('America/New_York')).isoformat(),
              'remainingEpisodes':len(remaining), 'nextSources':[
                  {'title':r['title'],'rssGuid':r.get('rssGuid'),'seconds':r['durationMs']/1000,
                   'verifiedTransport':bool(r.get('verifiedTransport')), 'fullSpotifyVideo':bool(r.get('verifiedSpotifyFullVideo'))}
                  for r in remaining[:10]]}
          output=json.dumps(evidence,indent=2)
          print(output)
          Path('continuity-audit.json').write_text(output+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Read-only continuity audit\n\n```json\n'+output+'\n```\n')
          assert workflows[0]['state']=='active', 'Rubarata production workflow is not active'
          assert not state.get('hold'), 'Rubarata queue is on hold'
          PY
      - name: Exercise cadence, restarts, pending recovery and progression with fake APIs only
        run: python3 -m unittest discover -s rubaradaclips_repurpose -p test_pipeline.py -v
      - name: Save scheduler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubarata-continuity-audit-${{ github.run_number }}
          path: continuity-audit.json
          retention-days: 3
          if-no-files-found: warn
