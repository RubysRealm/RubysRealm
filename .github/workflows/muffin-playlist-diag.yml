name: MuffinDrama playlist diagnostic
on:
  push:
    paths:
      - '.github/workflows/muffin-playlist-diag.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome helper
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
      - name: Resolve Episode 4 through SSSTik browser
        run: |
          cat > probe.cjs <<'JS'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const chrome=['/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(p=>fs.existsSync(p));
          if(!chrome) throw new Error('Chrome missing');
          const video='https://www.tiktok.com/@muffindrama_us/video/7682996946042297620';
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage','--disable-blink-features=AutomationControlled']});
            const page=await browser.newPage();
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36');
            await page.setViewport({width:1365,height:1600});
            const net=[];
            page.on('response',r=>{const u=r.url(); if(/tikcdn|ssstik|tiktok/.test(u)) net.push({url:u,status:r.status(),ct:r.headers()['content-type']||''})});
            await page.goto('https://ssstik.io/en-1',{waitUntil:'domcontentloaded',timeout:90000});
            await new Promise(r=>setTimeout(r,5000));
            const pre=await page.evaluate(()=>({title:document.title,text:(document.body?.innerText||'').slice(0,6000),inputs:[...document.querySelectorAll('input')].map(x=>({id:x.id,name:x.name,type:x.type,placeholder:x.placeholder})),buttons:[...document.querySelectorAll('button')].map(x=>({id:x.id,type:x.type,text:x.innerText}))}));
            console.log('PRE',JSON.stringify(pre));
            const input=await page.$('input[type="text"],input[type="url"],input[name="id"],input');
            if(!input) throw new Error('No input found');
            await input.click({clickCount:3});
            await input.type(video,{delay:4});
            const form=await input.evaluateHandle(el=>el.form);
            if(form && form.asElement()) {
              await form.asElement().evaluate(f=>f.requestSubmit ? f.requestSubmit() : f.submit());
            } else {
              const btn=await page.$('button[type="submit"],button');
              if(!btn) throw new Error('No submit button');
              await btn.click();
            }
            await new Promise(r=>setTimeout(r,12000));
            const out=await page.evaluate(()=>({
              url:location.href,
              title:document.title,
              text:(document.body?.innerText||'').slice(0,12000),
              links:[...document.querySelectorAll('a[href]')].map(a=>({href:a.href,text:(a.innerText||'').trim(),cls:a.className})).filter(x=>/tikcdn|download|watermark|video|ssstik/i.test(x.href+' '+x.text+' '+x.cls)).slice(0,100)
            }));
            console.log('OUT',JSON.stringify(out));
            console.log('NET',JSON.stringify(net.slice(-150)));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          timeout 240 node probe.cjs
