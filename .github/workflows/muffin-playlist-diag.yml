name: MuffinDrama playlist diagnostic
on:
  push:
    paths:
      - '.github/workflows/muffin-playlist-diag.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install resolver
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent @tobyg74/tiktok-api-dl
      - name: Probe direct short-drama episode downloaders
        run: |
          cat > probe.cjs <<'JS'
          const Tiktok=require('@tobyg74/tiktok-api-dl');
          const url='https://www.tiktok.com/shortdrama/episode/7682993954661553173/4';
          const timeout=(ms)=>new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms));
          (async()=>{
            for (const version of ['v2','v3']) {
              try {
                const r=await Promise.race([Tiktok.Downloader(url,{version}),timeout(45000)]);
                console.log('RESULT_'+version,JSON.stringify(r));
              } catch(e) {
                console.log('ERROR_'+version,String(e?.message||e));
              }
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          timeout 120 node probe.cjs
