name: Publish Realistic Character Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-realistic-characters.yml'

permissions:
  contents: write

jobs:
  publish:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download generated character references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p characters
          curl --fail --location 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/0f77efc6-1265-422f-ae24-7e7e5b3f4233/Photorealistic_full_body_portrait_of_a_fictional_adult_man_a.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzNiYTdkMDk3ODI1MWRmZCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4ODEwNjEyMX0.brChBQ6LLke5FJ1vV1fqQJbl54OUMg_8zLTCXjL9iT8' -o characters/man.png
          curl --fail --location 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/c2ee21e8-350a-4412-b8b0-318b2d8a0045/Photorealistic_full_body_portrait_of_a_fictional_adult_woman.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjI1YTkwMTBmMmQ3MDJiZSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4ODA4NTM5Mn0.bCMe9R2lT20wOZhS1-qigDCDRpUPg1yqvsHIBSlt4Zg' -o characters/woman.png
          file characters/man.png characters/woman.png
      - name: Publish permanent character assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='characters-v1'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Ruby's Realm Realistic Characters v1" --notes "Permanent fictional photorealistic character references for automated story rendering."
          fi
          gh release upload "$TAG" characters/man.png characters/woman.png --clobber
