name: RubyClips His Story transport probe
on:
  push:
    paths:
      - 'rubyclips/hisstory_transport.trigger'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade yt-dlp
      - name: Probe exact His Story transport
        run: python rubyclips/probe_hisstory_transport.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hisstory-transport-probe
          path: rubyclips/hisstory_transport_probe/
          retention-days: 2
