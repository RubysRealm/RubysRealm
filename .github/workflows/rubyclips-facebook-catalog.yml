name: RubyClips Facebook preset-part catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/rubyclips_facebook_catalog.py'
      - '.github/workflows/rubyclips-facebook-catalog.yml'

permissions:
  contents: read

concurrency:
  group: rubyclips-facebook-catalog
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discovery tools
        run: |
          pip install playwright yt-dlp
          python -m playwright install chromium --with-deps
      - name: Catalog preset Facebook parts only
        run: python tools/rubyclips_facebook_catalog.py
