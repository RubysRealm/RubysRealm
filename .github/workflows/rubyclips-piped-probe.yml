name: Rubaradaclips Source Resolver Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rubyclips-piped-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: selected-current
            video_id: jXkBF-MCjEA
          - label: known-valid-reddit
            video_id: KbB2A79w00I
          - label: known-valid-productivity
            video_id: gTZi1vZ4Zes
    steps:
      - name: Probe deployed Piped edge resolver
        shell: bash
        run: |
          set +e
          URL="https://rubys-realm.vercel.app/api/rubyclips-post?pipedVideo=${{ matrix.video_id }}"
          CODE="$(curl -sS --max-time 45 -o /tmp/piped.json -w '%{http_code}' "$URL")"
          echo "label=${{ matrix.label }} video=${{ matrix.video_id }} piped_http=$CODE"
          cat /tmp/piped.json || true
          echo

      - name: Probe Render/Cobalt resolver
        shell: bash
        run: |
          set +e
          VIDEO="https://www.youtube.com/watch?v=${{ matrix.video_id }}"
          CODE="$(curl -sS --max-time 60 -o /tmp/cobalt.json -w '%{http_code}' \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -X POST 'https://rubyclips-cobalt-3.onrender.com/' \
            --data "{\"url\":\"$VIDEO\",\"videoQuality\":\"720\",\"youtubeVideoCodec\":\"h264\",\"downloadMode\":\"auto\",\"alwaysProxy\":true}")"
          echo "label=${{ matrix.label }} video=${{ matrix.video_id }} cobalt_http=$CODE"
          cat /tmp/cobalt.json || true
          echo

      - name: Probe phone media bridge with tiny cut
        shell: bash
        run: |
          set +e
          URL="https://rubyclips-phone-host.onrender.com/api/auto-cut?v=${{ matrix.video_id }}&start=0&duration=8"
          CODE="$(curl -sS -L --max-time 75 -H 'Range: bytes=0-262143' -o /tmp/phone.bin -w '%{http_code}' "$URL")"
          SIZE="$(wc -c < /tmp/phone.bin 2>/dev/null | tr -d ' ' || echo 0)"
          TYPE="$(file -b /tmp/phone.bin 2>/dev/null || true)"
          echo "label=${{ matrix.label }} video=${{ matrix.video_id }} phone_http=$CODE bytes=$SIZE type=$TYPE"
