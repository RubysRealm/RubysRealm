name: Oracle public-call paper study
on:
  push:
    branches: [oracle-paper-study-20261020]
    paths:
      - '.github/workflows/oracle-paper-study.yml'
      - 'START_STUDY'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oracle-public-paper-study-20261020
  cancel-in-progress: true
jobs:
  observe_1:
    name: Observe public calls — segment 1 of 8
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install numerical analysis dependency
        run: python -m pip install numpy
      - name: Validate paper execution calculations
        run: python -m unittest -v test_study.py
      - name: Record public calls, quotes, depth and official settlements
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u collect.py --seconds 18360 --segment 1 --github
      - name: Download saved study observations
        if: ${{ !cancelled() }}
        run: git clone --depth 1 --single-branch --branch oracle-public-study-data-20261020 https://github.com/RubysRealm/RubysRealm.git sample-data
      - name: Compare paper settings and publish coverage
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python publish_analysis.py
  observe_2:
