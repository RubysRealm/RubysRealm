name: RubyClips Facebook catalog probe
on:
  push:
    paths:
      - 'rubyclips/facebook_catalog_probe.trigger'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet --upgrade yt-dlp
      - run: python rubyclips/facebook_page_catalog_probe.py
