name: Publish approved recovery release

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-recovery.yml'
  workflow_dispatch:

concurrency:
  group: rubys-realm-approved-release-publisher
  cancel-in-progress: false

jobs:
  publish-approved-release:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Respect Buffer rate limit and publish existing approved release
        shell: bash
        run: |
          set -euo pipefail
          TAG="reference-story-33260745398"
          URL="https://rubys-realm.vercel.app/api/auto-post?tag=${TAG}"
          RESPONSE=''
          POST_ID=''
          for i in $(seq 1 20); do
            RESPONSE="$(curl -sS --max-time 90 "$URL" || true)"
            printf '%s\n' "$RESPONSE"
            POST_ID="$(printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("postId") or "")' 2>/dev/null || true)"
            OK="$(printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); print("yes" if d.get("ok") else "no")' 2>/dev/null || true)"
            if [ "$OK" = "yes" ] && [ -n "$POST_ID" ]; then
              echo "POST_ID=$POST_ID" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 90
          done
          exit 1
      - name: Confirm TikTok publish completion
        shell: bash
        run: |
          set -euo pipefail
          STATUS_URL="https://rubys-realm.vercel.app/api/buffer-status?post_id=${POST_ID}"
          RESPONSE=''
          for i in $(seq 1 40); do
            RESPONSE="$(curl -sS --max-time 60 "$STATUS_URL" || true)"
            STATE="$(printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); print(((d.get("post") or {}).get("status") or "").lower())' 2>/dev/null || true)"
            if [ "$STATE" = "sent" ]; then printf '%s\n' "$RESPONSE"; exit 0; fi
            if [ "$STATE" = "failed" ] || [ "$STATE" = "error" ]; then printf '%s\n' "$RESPONSE"; exit 1; fi
            sleep 30
          done
          printf '%s\n' "$RESPONSE"
          exit 1
