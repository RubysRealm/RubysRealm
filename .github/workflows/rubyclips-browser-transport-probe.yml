name: RubyClips browser video transport probe
on:
  push:
    paths:
      - 'rubyclips/youtube_embed_probe.trigger'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Verify exact oldest BabyJamie video playback
        run: python rubyclips/youtube_embed_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: babyjamie-oldest-browser-transport
          path: rubyclips/youtube_embed_probe/
          retention-days: 1
