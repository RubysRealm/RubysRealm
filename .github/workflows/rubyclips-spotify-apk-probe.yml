name: RubyClips Spotify APK probe
on:
  push:
    paths:
      - 'rubyclips/spotify_apk_probe.trigger'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe official Spotify APK endpoints
        shell: bash
        run: |
          set -u
          urls=(
            'https://download.scdn.co/SpotifyAndroid.apk'
            'https://download.spotify.com/android/SpotifyAndroid.apk'
            'https://www.spotify.com/download/android/SpotifyAndroid.apk'
            'https://download.scdn.co/Spotify.apk'
          )
          ok=0
          for url in "${urls[@]}"; do
            echo "=== $url ==="
            rm -f /tmp/spotify.bin /tmp/headers
            code=$(curl -L -sS -A 'Mozilla/5.0 (Linux; Android 15; Pixel 7 Pro)'               --connect-timeout 15 --max-time 90 -D /tmp/headers -o /tmp/spotify.bin               -w '%{http_code}' "$url" || true)
            echo "HTTP=$code"
            grep -Ei '^(content-type|content-length|location):' /tmp/headers | tail -10 || true
            if [ -s /tmp/spotify.bin ]; then
              bytes=$(stat -c '%s' /tmp/spotify.bin)
              echo "BYTES=$bytes"
              file /tmp/spotify.bin || true
              head -c 8 /tmp/spotify.bin | od -An -tx1
              if [ "$bytes" -gt 5000000 ] && head -c2 /tmp/spotify.bin | grep -q $'PK'; then
                echo "OFFICIAL_APK_OK=$url"
                sha256sum /tmp/spotify.bin
                ok=1
                break
              fi
            fi
          done
          test "$ok" = 1
