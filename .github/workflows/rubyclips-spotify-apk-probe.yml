name: RubyClips Spotify APK probe
on:
  push:
    paths:
      - 'rubyclips/spotify_apk_probe.trigger'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google Play downloader
        run: |
          python -m pip install --quiet --upgrade gplaycli
          gplaycli --version || true
      - name: Download Spotify from Google Play
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/spotify-apk
          gplaycli -d com.spotify.music -f /tmp/spotify-apk -y
          find /tmp/spotify-apk -maxdepth 1 -type f -printf '%f %s bytes\n'
          apk=$(find /tmp/spotify-apk -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          test -s "$apk"
          file "$apk"
          sha256sum "$apk"
          python - "$apk" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          b=p.read_bytes()[:8]
          print('MAGIC',b.hex())
          assert p.stat().st_size > 5_000_000
          assert b[:2] == b'PK'
          PY
