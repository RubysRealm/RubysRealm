name: Ruby's Realm podcast repurpose and TikTok publish

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1,5,9,13,17,21 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/podcast-repurpose.yml'

permissions:
  contents: write

concurrency:
  group: rubys-realm-podcast-repurpose
  cancel-in-progress: false

jobs:
  split-and-publish-next-part:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Ruby's Realm
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip yt-dlp

      - name: Prepare corrected next long-form story part
        env:
          PODCAST_VIDEO_SOURCE: https://www.dailymotion.com/user/MasterPOVYT/videos
          PART_TARGET_SECONDS: '180'
          PART_MIN_SECONDS: '105'
          PART_MAX_SECONDS: '220'
        run: python podcast_repurpose/repurpose_centered.py

      - name: Convert manifest for existing Buffer TikTok publisher
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('podcast_repurpose/output/manifest.json')
          m=json.loads(p.read_text())
          src=m['source']
          out={
            'platform':'rubys-realm-podcast-repost-v1',
            'storyId':src['id'],
            'title':src['title'],
            'partNumber':int(m['part']),
            'totalParts':int(m['totalParts']),
            'partLabel':f"Story segment {int(m['part'])}",
            'storyTitleBurnedIn':True,
            'partLabelBurnedIn':True,
            'captionsBurnedIn':True,
            'captionTiming':'word-timestamped narration transcription',
            'durationSeconds':float(m['durationSeconds']),
            'file':Path(m['video']).name,
            'sourceUrl':src['url']
          }
          p.write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Publish corrected part as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MANIFEST='podcast_repurpose/output/manifest.json'
          STORY_ID="$(python -c 'import json,re; s=str(json.load(open("podcast_repurpose/output/manifest.json"))["storyId"]); print(re.sub(r"[^A-Za-z0-9_-]+","-",s))')"
          PART_NUMBER="$(python -c 'import json; print(json.load(open("podcast_repurpose/output/manifest.json"))["partNumber"])')"
          TAG="podcast-part-${STORY_ID}-${PART_NUMBER}"
          VIDEO="$(find podcast_repurpose/output -maxdepth 1 -name '*.mp4' -print -quit)"
          test -n "$VIDEO"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "$VIDEO" "$MANIFEST#manifest.json"             --title "Ruby's Realm corrected podcast part ${GITHUB_RUN_NUMBER}"             --notes "Corrected centered title layout; routed through the existing Buffer-connected TikTok publisher."
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Wait for existing Buffer TikTok endpoint
        run: |
          set -euo pipefail
          URL='https://rubys-realm.vercel.app/api/auto-post'
          for i in $(seq 1 48); do
            CODE="$(curl -sS -o /tmp/probe.json -w '%{http_code}' "$URL" || true)"
            if [ "$CODE" = '400' ]; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/probe.json || true
          exit 1

      - name: Send corrected part through Buffer to TikTok
        run: |
          set -euo pipefail
          BASE="https://rubys-realm.vercel.app/api/auto-post?tag=${RELEASE_TAG}"
          RESPONSE="$(curl -sS --max-time 90 "$BASE" || true)"
          if printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("ok") else 1)' 2>/dev/null; then
            printf '%s\n' "$RESPONSE" > /tmp/post-response.json
          else
            echo "Initial publish result is uncertain/failed. Holding 10 minutes before any retry."
            sleep 600
            CHECK="$(curl -sS --max-time 90 "${BASE}&check=1" || true)"
            printf '%s\n' "$CHECK"
            if printf '%s' "$CHECK" | python -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("ok") and d.get("exists") else 1)' 2>/dev/null; then
              echo "Exact story/part is already present; no repost will be attempted."
              printf '%s' "$CHECK" > /tmp/post-response.json
            else
              echo "Exact story/part was verified absent after 10 minutes; one retry is allowed."
              RETRY="$(curl -sS --max-time 90 "$BASE" || true)"
              printf '%s\n' "$RETRY"
              printf '%s' "$RETRY" > /tmp/post-response.json
            fi
          fi
          POST_ID="$(python -c 'import json; d=json.load(open("/tmp/post-response.json")); assert d.get("ok"), d; print(d.get("postId") or "")')"
          test -n "$POST_ID"
          echo "POST_ID=$POST_ID" >> "$GITHUB_ENV"

      - name: Advance only after Buffer accepts the TikTok post
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          state_path=Path('podcast_repurpose/state.json')
          state=json.loads(state_path.read_text()) if state_path.exists() else {'current':None,'completed':[]}
          manifest=json.loads(Path('podcast_repurpose/output/manifest.json').read_text())
          part=int(manifest['partNumber'])
          total=int(manifest['totalParts'])
          story_id=manifest['storyId']
          if part >= total:
              done=list(state.get('completed') or [])
              if story_id not in done: done.append(story_id)
              state['completed']=done[-500:]
              state['current']=None
          else:
              state['current']={
                'id':story_id,
                'url':manifest['sourceUrl'],
                'title':manifest['title'],
                'next_part':part+1,
                'total_parts':total
              }
          state_path.write_text(json.dumps(state,indent=2)+'\n')
          PY
          git config user.name 'rubys-realm-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add podcast_repurpose/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Advance podcast TikTok queue after Buffer acceptance [skip ci]'
            git pull --rebase origin main
            git push
          fi

      - name: Keep a short-term copy of the posted part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-repurpose-${{ github.run_number }}
          path: |
            podcast_repurpose/output/*.mp4
            podcast_repurpose/output/*.json
          if-no-files-found: warn
          retention-days: 2
