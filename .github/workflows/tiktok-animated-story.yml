name: Generate and publish animated TikTok story

on:
  workflow_dispatch:
  push:
    paths:
      - 'tiktok_animator/**'
      - '.github/workflows/tiktok-animated-story.yml'
  schedule:
    - cron: '0 4 * * *'   # 12:00 AM ET during EDT
    - cron: '0 13 * * *'  # 9:00 AM ET during EDT
    - cron: '0 16 * * *'  # 12:00 PM ET during EDT
    - cron: '0 19 * * *'  # 3:00 PM ET during EDT
    - cron: '0 22 * * *'  # 6:00 PM ET during EDT
    - cron: '0 1 * * *'   # 9:00 PM ET during EDT

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Install renderer dependency
        run: pip install -r tiktok_animator/requirements.txt
      - name: Generate animated story video
        run: python tiktok_animator/story_factory.py
      - name: Publish directly to TikTok
        env:
          TT_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: python tiktok_animator/publisher.py
      - name: Upload generated MP4 backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animated-tiktok-story-${{ github.run_number }}
          path: tiktok_animator/output/*.mp4
          if-no-files-found: error
          retention-days: 7
