name: Ruby's Realm clean TikTok production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'production/**'
      - 'api/story-image.js'
      - '.github/workflows/tiktok-animated-story.yml'
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: rubys-realm-clean-production
  cancel-in-progress: true

jobs:
  render-review-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout clean rebuild
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install clean platform dependencies
        run: pip install -r production/requirements.txt

      - name: Mint protected image-service token
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubys-realm-image-generator")"
          TOKEN="$(printf '%s' "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "GITHUB_OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Wait for rebuilt protected image service
        run: |
          set -euo pipefail
          URL="https://rubys-realm.vercel.app/api/story-image"
          for i in $(seq 1 48); do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$URL" || true)"
            if [ "$CODE" = "405" ]; then
              echo "Clean image service deployed."
              exit 0
            fi
            sleep 5
          done
          echo "Clean image service did not deploy in time."
          exit 1

      - name: Build from scratch
        env:
          STORY_SEED: ${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf production/work production/output
          python production/pipeline.py

      - name: Validate rebuilt manifest and actual frame samples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path('production/output/manifest.json')
          if not p.exists():
              raise SystemExit('manifest missing')
          d=json.loads(p.read_text())
          if d.get('platform')!='rubys-realm-clean-rebuild-v1':
              raise SystemExit('legacy renderer detected')
          if not d.get('qualityPassed'):
              raise SystemExit('clean rebuild quality gate failed')
          if d.get('publicationAllowed') is not False:
              raise SystemExit('publication unexpectedly enabled')
          checks=d.get('checks') or {}
          failed=[k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('failed checks: '+', '.join(failed))
          samples=d.get('reviewSamples') or []
          if len(samples)<6:
              raise SystemExit('not enough actual-frame inspection samples')
          for sample in samples:
              frame=Path(sample['file'])
              if not frame.exists() or frame.stat().st_size<10000:
                  raise SystemExit(f"missing frame sample: {frame}")
          print(json.dumps({
              'title':d.get('title'),
              'duration':d.get('durationSeconds'),
              'scenes':d.get('sceneCount'),
              'samples':len(samples),
              'checks':checks
          }, indent=2))
          PY

      - name: Package review frames
        run: |
          cd production/output
          zip -j review-frames.zip review_frames/*.jpg

      - name: Create viewable MP4 review release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="clean-rebuild-${GITHUB_RUN_ID}"
          VIDEO="$(find production/output -maxdepth 1 -name '*.mp4' -print -quit)"
          test -n "$VIDEO"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG"             "$VIDEO"             production/output/manifest.json             production/output/review-frames.zip             --title "Ruby's Realm Clean Rebuild #${GITHUB_RUN_NUMBER}"             --notes "Fresh clean-platform review candidate. Every scene is generated for its exact narration beat, cuts are tied to narration word boundaries, one image is visible at a time, the persistent polished header uses a semantically complete occupation title, and publication remains blocked pending approval."

      - name: Keep TikTok publication blocked
        run: |
          echo "No TikTok/Buffer publication occurs in the clean rebuild until the new example is approved."

      - name: Upload review backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubys-realm-clean-rebuild-${{ github.run_number }}
          path: |
            production/output/*.mp4
            production/output/manifest.json
            production/output/review_frames/*.jpg
            production/output/review-frames.zip
          if-no-files-found: warn
          retention-days: 7
