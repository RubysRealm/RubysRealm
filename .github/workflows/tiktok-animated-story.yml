name: Generate and publish reference-style TikTok story

on:
  workflow_dispatch:
  push:
    paths:
      - 'tiktok_animator/**'
      - '.github/workflows/tiktok-animated-story.yml'
  schedule:
    - cron: '0 14 * * *' # quality-first daily cycle; push still runs immediately

permissions:
  contents: write

concurrency:
  group: rubys-realm-reference-story
  cancel-in-progress: true

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Install renderer dependencies
        run: pip install -r tiktok_animator/requirements.txt
      - name: Generate narration-driven reference-style story
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python tiktok_animator/story_factory.py
      - name: Verify quality manifest and final media
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          manifests=sorted(pathlib.Path('tiktok_animator/output').glob('*.json'))
          videos=sorted(pathlib.Path('tiktok_animator/output').glob('*.mp4'))
          if not manifests or not videos: raise SystemExit('missing final output')
          data=json.loads(manifests[-1].read_text())
          if not data.get('qualityPassed'): raise SystemExit('reference-style quality gate failed')
          if data.get('renderer')!='reference-narration-story-v1': raise SystemExit('wrong renderer')
          if data.get('qualityGate')!='reference-narration-clean-screen-v1': raise SystemExit('wrong quality gate')
          if not all((data.get('checks') or {}).values()): raise SystemExit('one or more quality checks failed')
          subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(videos[-1])],check=True)
          print(json.dumps(data.get('checks',{}),indent=2))
          PY
      - name: Create approved public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="reference-story-${GITHUB_RUN_ID}"
          VIDEO="$(find tiktok_animator/output -maxdepth 1 -name '*.mp4' -print -quit)"
          MANIFEST="$(find tiktok_animator/output -maxdepth 1 -name '*.json' -print -quit)"
          cp "$MANIFEST" manifest.json
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "$VIDEO" manifest.json --title "Ruby's Realm Reference Story ${GITHUB_RUN_NUMBER}" --notes "Quality-gated reference-narration render for automated TikTok publishing."
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Send approved release to connected TikTok channel
        run: |
          set -euo pipefail
          URL="https://rubys-realm.vercel.app/api/auto-post?tag=${RELEASE_TAG}"
          RESPONSE=''
          for i in $(seq 1 18); do
            RESPONSE="$(curl -sS --max-time 90 "$URL" || true)"
            if printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("ok") else 1)' 2>/dev/null; then
              break
            fi
            sleep 10
          done
          printf '%s\n' "$RESPONSE"
          printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok"), d; print("POST_ID="+str(d["postId"]))' >> "$GITHUB_ENV"
      - name: Confirm TikTok publish completion
        run: |
          set -euo pipefail
          STATUS_URL="https://rubys-realm.vercel.app/api/buffer-status?post_id=${POST_ID}"
          RESPONSE=''
          for i in $(seq 1 36); do
            RESPONSE="$(curl -sS --max-time 60 "$STATUS_URL" || true)"
            STATE="$(printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); print(((d.get("post") or {}).get("status") or "").lower())' 2>/dev/null || true)"
            if [ "$STATE" = "sent" ]; then
              printf '%s\n' "$RESPONSE"
              exit 0
            fi
            if [ "$STATE" = "failed" ] || [ "$STATE" = "error" ]; then
              printf '%s\n' "$RESPONSE"
              exit 1
            fi
            sleep 10
          done
          printf '%s\n' "$RESPONSE"
          exit 1
      - name: Upload generated MP4 and manifest backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-style-tiktok-story-${{ github.run_number }}
          path: |
            tiktok_animator/output/*.mp4
            tiktok_animator/output/*.json
          if-no-files-found: error
          retention-days: 7
