name: Generate and publish reference-style TikTok story

on:
  workflow_dispatch:
  push:
    paths:
      - 'tiktok_animator/**'
      - 'api/auto-post.js'
      - 'api/buffer.js'
      - 'api/buffer-status.js'
      - 'api/story-image.js'
      - 'package.json'
      - '.github/workflows/tiktok-animated-story.yml'
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: rubys-realm-reference-story
  cancel-in-progress: true

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install renderer dependencies
        run: pip install -r tiktok_animator/requirements.txt
      - name: Mint protected image-service token
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubys-realm-image-generator")"
          TOKEN="$(printf '%s' "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "GITHUB_OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Wait for protected image service deployment
        run: |
          set -euo pipefail
          URL="https://rubys-realm.vercel.app/api/story-image"
          for i in $(seq 1 36); do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$URL" || true)"
            if [ "$CODE" = "405" ]; then
              echo "Generated-image service is deployed."
              exit 0
            fi
            sleep 5
          done
          echo "Generated-image service did not become ready in time."
          exit 1
      - name: Generate exact-target illustrated story with automatic QC retry
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_STORY_MODEL: ${{ vars.AI_STORY_MODEL }}
          AI_IMAGE_MODEL: openai/gpt-image-2
          AI_IMAGE_CREDIT_RESERVE: '0.75'
          STORY_TITLE: "The Midnight Desk"
          STORY_PART: "Part 1"
          STORY_TEXT: >-
            A woman bought an old desk from a courthouse liquidation sale because she wanted something solid for her home office. The desk was heavy oak, covered in scratches, and one drawer refused to open. After two days of trying, she removed the drawer above it and found a thin brass latch hidden inside the frame. The locked drawer slid open. There was no paperwork inside. There was only a small black notebook, a silver hotel bell, and a photograph of a house she recognized immediately. It was the house across the street from hers. The photograph looked old, but in the upstairs window she could see a figure standing behind the curtain. On the back, someone had written three words: ring at midnight. She assumed it was a joke left by the previous owner, until she noticed the silver bell had the same street number engraved underneath it as the house in the photograph. That night, just before midnight, she carried the bell to her front window and looked across the street. The house was dark. Nobody had lived there since she moved into the neighborhood. At exactly midnight, the porch light turned on by itself. She rang the little bell once. A second later, a light appeared in the upstairs window. Then the curtain moved. She grabbed the notebook and opened it for the first time. Every page contained a date followed by a short description of something that happened on the street. A moving truck arriving. A tree falling in a storm. A police car stopping at the corner. The final written entry had tomorrow's date. It said only: new owner opens the desk. Beneath that sentence was her full name. She dropped the notebook. Across the street, the upstairs window opened. Something white fluttered down onto the lawn. She waited until morning before going outside. It was another photograph. This one showed her standing at her own window holding the silver bell. The picture had been taken from inside the empty house. On the back was a new message: the desk remembers every owner. She called the courthouse and asked who had owned it before the liquidation. The clerk went quiet. The desk had not come from an office. It had been recovered from the abandoned house across the street.
          V7_IMAGE_SERVICE_URL: https://rubys-realm.vercel.app/api/story-image
          GITHUB_OIDC_TOKEN: ${{ env.GITHUB_OIDC_TOKEN }}
        run: |
          set +e
          PASSED=0
          for ATTEMPT in 0 1; do
            rm -rf tiktok_animator/output tiktok_animator/tmp
            mkdir -p tiktok_animator/output tiktok_animator/tmp
            export STORY_SEED=$((GITHUB_RUN_ID + ATTEMPT * 104729))
            echo "Reference-target render attempt $((ATTEMPT+1))/2 with seed ${STORY_SEED}"
            python tiktok_animator/reference_story_v3.py
            RC=$?
            if [ "$RC" -eq 0 ]; then
              PASSED=1
              echo "Quality-approved target render completed on attempt $((ATTEMPT+1))"
              break
            fi
            echo "Attempt $((ATTEMPT+1)) failed strict target QC; rebuilding with a fresh story seed and fresh visual selection."
          done
          if [ "$PASSED" -ne 1 ]; then
            echo "Both strict target attempts failed. Refusing to publish substandard media."
            exit 1
          fi
      - name: Verify exact-target manifest and final media
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          manifests=sorted(pathlib.Path('tiktok_animator/output').glob('*.json'))
          videos=sorted(pathlib.Path('tiktok_animator/output').glob('*.mp4'))
          if not manifests or not videos: raise SystemExit('missing final output')
          data=json.loads(manifests[-1].read_text())
          if not data.get('qualityPassed'): raise SystemExit('strict reference target quality gate failed')
          if data.get('renderer')!='reference-illustrated-story-v7': raise SystemExit('wrong renderer')
          if data.get('qualityGate')!='reference-example-target-v7': raise SystemExit('wrong quality gate')
          if data.get('storySource') not in ('ai-gateway-original','procedural-original-v3','supplied'):
              raise SystemExit('story source is not approved')
          checks=data.get('checks') or {}
          if not checks or not all(checks.values()): raise SystemExit('one or more strict target checks failed')
          if float(data.get('visualCoverageRatio') or 0)<0.98: raise SystemExit('image does not continuously fill storytelling area')
          if int(data.get('visualInsertCount') or 0)<10: raise SystemExit('not enough story-matched scene images')
          if int(data.get('captionMaxWords') or 99)!=1: raise SystemExit('captions are not direct word-boundary cues')
          style=data.get('style') or {}
          if style.get('lower_panel')!='none': raise SystemExit('lower teal panel still enabled')
          if style.get('caption_timing')!='direct-neural-word-boundaries': raise SystemExit('caption timing is not tied directly to narration')
          if float(style.get('generated_illustration_ratio') or 0)<0.65: raise SystemExit('generated reference-style illustration ratio is too low')
          subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(videos[-1])],check=True)
          print(json.dumps({'checks':checks,'voice':style.get('voice_used'),'generatedIllustrationRatio':style.get('generated_illustration_ratio')},indent=2))
          PY
      - name: Create approved public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="reference-story-${GITHUB_RUN_ID}"
          VIDEO="$(find tiktok_animator/output -maxdepth 1 -name '*.mp4' -print -quit)"
          MANIFEST="$(find tiktok_animator/output -maxdepth 1 -name '*.json' -print -quit)"
          cp "$MANIFEST" manifest.json
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "$VIDEO" manifest.json --title "Ruby's Realm Reference Target ${GITHUB_RUN_NUMBER}" --notes "Fresh original story with continuous generated story illustrations, no lower teal panel, upgraded neural narration, and direct word-boundary captions."
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Send approved release to connected TikTok channel
        run: |
          set -euo pipefail
          URL="https://rubys-realm.vercel.app/api/auto-post?tag=${RELEASE_TAG}"
          RESPONSE=''
          for i in $(seq 1 30); do
            RESPONSE="$(curl -sS --max-time 90 "$URL" || true)"
            if printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("ok") and d.get("renderer")=="reference-illustrated-story-v7" else 1)' 2>/dev/null; then break; fi
            sleep 10
          done
          printf '%s\n' "$RESPONSE"
          printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok"), d; assert d.get("renderer")=="reference-illustrated-story-v7", d; print("POST_ID="+str(d["postId"]))' >> "$GITHUB_ENV"
      - name: Confirm TikTok publish completion
        run: |
          set -euo pipefail
          STATUS_URL="https://rubys-realm.vercel.app/api/buffer-status?post_id=${POST_ID}"
          RESPONSE=''
          for i in $(seq 1 48); do
            RESPONSE="$(curl -sS --max-time 60 "$STATUS_URL" || true)"
            STATE="$(printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); print(((d.get("post") or {}).get("status") or "").lower())' 2>/dev/null || true)"
            if [ "$STATE" = "sent" ]; then printf '%s\n' "$RESPONSE"; exit 0; fi
            if [ "$STATE" = "failed" ] || [ "$STATE" = "error" ]; then printf '%s\n' "$RESPONSE"; exit 1; fi
            sleep 10
          done
          printf '%s\n' "$RESPONSE"
          exit 1
      - name: Upload generated MP4 and manifest backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-target-v7-tiktok-story-${{ github.run_number }}
          path: |
            tiktok_animator/output/*.mp4
            tiktok_animator/output/*.json
          if-no-files-found: error
          retention-days: 7

