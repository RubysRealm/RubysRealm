name: Generate and publish reference-style TikTok story

on:
  workflow_dispatch:
  push:
    paths:
      - 'tiktok_animator/**'
      - 'api/auto-post.js'
      - 'api/buffer.js'
      - 'api/buffer-status.js'
      - 'api/story-image.js'
      - 'package.json'
      - '.github/workflows/tiktok-animated-story.yml'
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: rubys-realm-reference-story
  cancel-in-progress: true

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install renderer dependencies
        run: pip install -r tiktok_animator/requirements.txt
      - name: Mint protected image-service token
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubys-realm-image-generator")"
          TOKEN="$(printf '%s' "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "GITHUB_OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Wait for protected image service deployment
        run: |
          set -euo pipefail
          URL="https://rubys-realm.vercel.app/api/story-image"
          for i in $(seq 1 36); do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$URL" || true)"
            if [ "$CODE" = "405" ]; then
              echo "Generated-image service is deployed."
              exit 0
            fi
            sleep 5
          done
          echo "Generated-image service did not become ready in time."
          exit 1
      - name: Generate exact-target illustrated story with automatic QC retry
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_STORY_MODEL: ${{ vars.AI_STORY_MODEL }}
          AI_IMAGE_MODEL: openai/gpt-image-2
          AI_IMAGE_CREDIT_RESERVE: '0.75'
          STORY_TITLE: "Your Life as a Restaurant Owner"
          STORY_PART: "Part 1"
          STORY_TEXT: >-
            You finally do it. After years of telling yourself you would rather work for yourself than spend another decade making somebody else rich, you sign the papers on a small neighborhood restaurant. From the sidewalk it looks like freedom. Your name is on the lease. Your menu is on the wall. For the first time in your life, when somebody asks what you do, you can say you own the place. The first morning starts before sunrise. You unlock the back door while the street is still dark, turn on the kitchen lights, and realize the refrigerator is warmer than it should be. Before you can even make coffee, you are on the phone with a repair company trying to convince someone to come before lunch service. Then your produce delivery arrives. Half the tomatoes are bruised, two boxes are missing, and the invoice is somehow higher than the quote you approved yesterday. You call the supplier while checking every case yourself because every bad ingredient is money you already spent. By seven thirty, your cook arrives. At seven forty, your dishwasher texts that he is sick. At eight, the repair technician tells you the refrigerator needs a part he does not have on the truck. You move everything you can into the walk-in and start changing the day's prep list. By ten, the dining room looks perfect. Tables are clean. Music is on. The kitchen smells incredible. A couple waiting outside takes a picture of the sign, and for about thirty seconds you remember why you wanted this life. Then the doors open. The first hour is slow enough that you start worrying nobody is coming. The next hour is so busy you wish half of them would leave. One table needs an allergy modification. Another says their food is taking too long. A delivery driver is standing at the counter asking for an order the kitchen never received. Your server needs change. Your cook needs more plates. The phone is ringing. You are answering questions while carrying food because owning the restaurant does not mean you stopped doing the work. It means every job nobody else can do becomes your job. In the middle of the rush, a customer waves you over. You expect another complaint. Instead, he tells you the meal reminds him of something his father used to make. He says he has driven past the building for years and is glad somebody finally made it feel alive again. That one sentence carries you through the next three hours. When lunch finally ends, you do not sit down. You check inventory. You compare what sold to what you expected to sell. You discover one menu item is popular but barely profitable because the portion cost is higher than you calculated. Another item almost nobody ordered has ingredients that will spoil tomorrow. You change tomorrow's special before those ingredients become trash. Then payroll hits your account. The number makes your stomach drop. Rent is due soon. Insurance is due after that. The refrigerator repair is now an emergency expense. Owning a busy restaurant and owning a profitable restaurant are not the same thing, and you learn that lesson faster than you wanted. Dinner starts at five. One employee is late, so you are back on the floor. A family walks in without a reservation and asks for a table you do not really have. You rearrange the dining room because turning people away feels impossible when you know exactly what every empty chair costs you. The night gets louder. Tickets line the kitchen rail. Steam fills the pass. For a while everything works exactly the way you imagined it would. The team moves together. Plates leave the kitchen. Guests laugh. The dining room is full. You stand near the register and watch the restaurant operate without you touching anything for maybe twenty seconds. Then a glass breaks and you grab a broom. At closing time, the last guests leave smiling. You lock the front door and look at the sales total. It is the best day since you opened. Then you subtract labor, food, fees, utilities, repairs, taxes, and the money you need to keep in the business. The giant number on the register becomes a much smaller number that actually belongs to you. Everybody else goes home. You stay. You wipe the counter, answer tomorrow's reservation messages, approve the next food order, and write a new schedule because two employees asked for the same day off. It is after midnight when you finally turn off the lights. You are exhausted, your feet hurt, and tomorrow starts in less than six hours. But when you step outside, you turn around and see your restaurant glowing behind the glass. Yesterday it was just a business you were trying to keep alive. Tonight there are people telling their friends about it. Tomorrow you get to do all of it again. This is your life as a restaurant owner.
          V7_IMAGE_SERVICE_URL: https://rubys-realm.vercel.app/api/story-image
          GITHUB_OIDC_TOKEN: ${{ env.GITHUB_OIDC_TOKEN }}
        run: |
          set +e
          PASSED=0
          for ATTEMPT in 0 1; do
            rm -rf tiktok_animator/output tiktok_animator/tmp
            mkdir -p tiktok_animator/output tiktok_animator/tmp
            export STORY_SEED=$((GITHUB_RUN_ID + ATTEMPT * 104729))
            echo "Reference-target render attempt $((ATTEMPT+1))/2 with seed ${STORY_SEED}"
            python tiktok_animator/reference_story_v3.py
            RC=$?
            if [ "$RC" -eq 0 ]; then
              PASSED=1
              echo "Quality-approved target render completed on attempt $((ATTEMPT+1))"
              break
            fi
            echo "Attempt $((ATTEMPT+1)) failed strict target QC; rebuilding with a fresh story seed and fresh visual selection."
          done
          if [ "$PASSED" -ne 1 ]; then
            echo "Both strict target attempts failed. Refusing to publish substandard media."
            exit 1
          fi
      - name: Verify exact-target manifest and final media
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          manifests=sorted(pathlib.Path('tiktok_animator/output').glob('*.json'))
          videos=sorted(pathlib.Path('tiktok_animator/output').glob('*.mp4'))
          if not manifests or not videos: raise SystemExit('missing final output')
          data=json.loads(manifests[-1].read_text())
          if not data.get('qualityPassed'): raise SystemExit('strict reference target quality gate failed')
          if data.get('renderer')!='reference-illustrated-story-v7': raise SystemExit('wrong renderer')
          if data.get('qualityGate')!='reference-example-target-v7': raise SystemExit('wrong quality gate')
          if data.get('storySource') not in ('ai-gateway-original','procedural-original-v3','supplied'):
              raise SystemExit('story source is not approved')
          checks=data.get('checks') or {}
          if not checks or not all(checks.values()): raise SystemExit('one or more strict target checks failed')
          if float(data.get('visualCoverageRatio') or 0)<0.98: raise SystemExit('image does not continuously fill storytelling area')
          if int(data.get('visualInsertCount') or 0)<18: raise SystemExit('not enough story-matched scene images')
          if int(data.get('captionMaxWords') or 99)!=1: raise SystemExit('captions are not direct word-boundary cues')
          style=data.get('style') or {}
          if style.get('lower_panel')!='none': raise SystemExit('lower teal panel still enabled')
          if style.get('caption_timing')!='direct-neural-word-boundaries': raise SystemExit('caption timing is not tied directly to narration')
          if float(style.get('generated_illustration_ratio') or 0)<0.98: raise SystemExit('generated reference-style illustration ratio is too low')
          subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(videos[-1])],check=True)
          print(json.dumps({'checks':checks,'voice':style.get('voice_used'),'generatedIllustrationRatio':style.get('generated_illustration_ratio')},indent=2))
          PY
      - name: Create approved public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="reference-story-${GITHUB_RUN_ID}"
          VIDEO="$(find tiktok_animator/output -maxdepth 1 -name '*.mp4' -print -quit)"
          MANIFEST="$(find tiktok_animator/output -maxdepth 1 -name '*.json' -print -quit)"
          cp "$MANIFEST" manifest.json
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "$VIDEO" manifest.json --title "Ruby's Realm Reference Target ${GITHUB_RUN_NUMBER}" --notes "Fresh original story with continuous generated story illustrations, no lower teal panel, upgraded neural narration, and direct word-boundary captions."
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Hold release until exact reference visual QC is implemented
        run: |
          echo "Publishing intentionally disabled: do not send any video until exact supplied-reference visual QC passes."
          exit 0
      - name: Upload generated MP4 and manifest backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-target-v7-tiktok-story-${{ github.run_number }}
          path: |
            tiktok_animator/output/*.mp4
            tiktok_animator/output/*.json
          if-no-files-found: error
          retention-days: 7

