name: Rubarataclips His Story Spotify repurpose
on:
  schedule:
    # Eligibility checks only; the queue enforces six hours after actual delivery.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  # Independent workflow completions wake the same guarded queue if its own
  # cron event is delayed. Never use artifacts or code from the triggering run.
  workflow_run:
    workflows:
      - "Ruby's Realm podcast repurpose and TikTok publish"
      - 'Continuous Facebook viral source discovery'
      - 'Rubarata unattended continuity audit'
    types: [completed]
    branches: [main]
  push:
    paths:
      - 'rubaradaclips_repurpose/run.trigger'
permissions:
  contents: write
concurrency:
  group: rubaradaclips-hisstory-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: RubysRealm/RubysRealm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record automatic wakeup source
        env:
          WAKE_EVENT: ${{ github.event_name }}
          WAKE_WORKFLOW: ${{ github.event.workflow_run.name }}
          WAKE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          printf 'Wakeup: %s; upstream: %s; run: %s\n' "$WAKE_EVENT" "$WAKE_WORKFLOW" "$WAKE_RUN"
          printf '### Automatic wakeup\nEvent: %s; upstream: %s; run: %s\n\n' "$WAKE_EVENT" "$WAKE_WORKFLOW" "$WAKE_RUN" >> "$GITHUB_STEP_SUMMARY"

      - name: Recover pending delivery before reading any source
        id: gate
        run: python3 rubaradaclips_repurpose/pipeline.py check --persist

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.allowed == 'true'
        with:
          python-version: '3.12'

      - name: Install verified source and media tools
        if: steps.gate.outputs.allowed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --quiet 'votify==1.9.9' 'yt-dlp==2026.8.19' 'numpy==2.3.5' 'scipy==1.17.0' 'pillow==12.3.0'

      - name: Build and submit exactly the current complete story part
        if: steps.gate.outputs.allowed == 'true'
        id: publish
        run: python3 rubaradaclips_repurpose/pipeline.py run --persist

      - name: Confirm actual TikTok delivery without rebuilding source
        if: success() && (steps.gate.outputs.pending == 'true' || steps.publish.outputs.pending == 'true')
        run: |
          for attempt in $(seq 1 12); do
            python3 rubaradaclips_repurpose/pipeline.py check --persist
            if python3 - <<'PY'
          import json
          state=json.load(open('rubaradaclips_repurpose/state.json'))
          raise SystemExit(0 if state.get('pending') else 1)
          PY
            then
              sleep 15
            else
              exit 0
            fi
          done
          echo 'Delivery remains pending. The next cron or backup wakeup reconciles this same attempt before preparing media.'

      - name: Save queue and source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubaradaclips-hisstory-${{ github.run_number }}
          path: |
            rubaradaclips_repurpose/state.json
            rubaradaclips_repurpose/output/manifest.json
            rubaradaclips_repurpose/output/part-info.json
            rubaradaclips_repurpose/work/verified-source/source-info.json
          if-no-files-found: warn
          retention-days: 3
