<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rubradaclips YouTube QR Login</title><style>body{margin:0;background:#08090d;color:#fff;font:16px system-ui;-webkit-font-smoothing:antialiased}main{max-width:980px;margin:auto;padding:12px}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.pill{background:#171923;border:1px solid #2d3040;border-radius:999px;padding:8px 12px}.screen{display:block;width:100%;height:auto;background:#000;border:1px solid #2d3040;border-radius:14px}.note{opacity:.84;font-size:14px;line-height:1.45;margin-top:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{font:16px system-ui;border-radius:10px;border:1px solid #343749;background:#171923;color:#fff;padding:10px 14px}</style></head><body><main><div class="top"><strong>Rubradaclips YouTube QR login</strong><span class="pill" id="status">Connecting…</span></div><img id="screen" class="screen" alt="YouTube TV QR login"><div class="note"><b>Scan the QR code shown on the screen with your phone and approve the YouTube sign-in.</b> This uses YouTube’s TV/console sign-in flow, so you do not type your Google password into this cloud browser.</div><div class="controls"><button onclick="key('Left')">←</button><button onclick="key('Up')">↑</button><button onclick="key('Down')">↓</button><button onclick="key('Right')">→</button><button onclick="key('Return')">Enter</button><button onclick="key('Escape')">Back</button></div></main><script>const q=new URLSearchParams(location.search),token=q.get('token')||'';const img=document.getElementById('screen'),statusEl=document.getElementById('status');function api(path,opt={}){const sep=path.includes('?')?'&':'?';return fetch(path+sep+'token='+encodeURIComponent(token),opt)}function refresh(){const probe=new Image();probe.onload=()=>{img.src=probe.src;statusEl.textContent='QR LIVE';statusEl.style.color='#7dff9b'};probe.onerror=()=>{statusEl.textContent='Starting…';statusEl.style.color='#ffd76a'};probe.src='/api/desktop-frame?token='+encodeURIComponent(token)+'&t='+Date.now()}setInterval(refresh,1200);refresh();function key(k){api('/api/desktop-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k})})}</script></body></html>
