<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rubradaclips YouTube Login</title><style>body{margin:0;background:#08090d;color:#fff;font:16px system-ui;-webkit-font-smoothing:antialiased}main{max-width:820px;margin:auto;padding:12px}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.pill{background:#171923;border:1px solid #2d3040;border-radius:999px;padding:8px 12px}.screen{display:block;width:100%;height:auto;background:#000;border:1px solid #2d3040;border-radius:14px;touch-action:manipulation}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button,input{font:16px system-ui;border-radius:10px;border:1px solid #343749;background:#171923;color:#fff;padding:10px 12px}input{flex:1;min-width:180px}button{cursor:pointer}.note{opacity:.75;font-size:13px;margin-top:10px}</style></head><body><main><div class="top"><strong>Rubradaclips YouTube login</strong><span class="pill" id="status">Connecting…</span></div><img id="screen" class="screen" alt="Cloud YouTube browser"><div class="controls"><input id="text" autocomplete="off" placeholder="Type into selected field"><button onclick="sendText()">Type</button><button onclick="key('Return')">Enter</button><button onclick="key('Tab')">Tab</button><button onclick="key('BackSpace')">⌫</button><button onclick="key('Escape')">Esc</button></div><div class="note">Tap the picture to click the cloud browser. Sign into the existing Signal Forge Google account. The source download starts automatically after YouTube recognizes the login.</div></main><script>const q=new URLSearchParams(location.search),token=q.get('token')||'';const img=document.getElementById('screen'),statusEl=document.getElementById('status');function api(path,opt={}){const sep=path.includes('?')?'&':'?';return fetch(path+sep+'token='+encodeURIComponent(token),opt)}function refresh(){const probe=new Image();probe.onload=()=>{img.src=probe.src;statusEl.textContent='LIVE';statusEl.style.color='#7dff9b'};probe.onerror=()=>{statusEl.textContent='Starting…';statusEl.style.color='#ffd76a'};probe.src='/api/desktop-frame?token='+encodeURIComponent(token)+'&t='+Date.now()}setInterval(refresh,900);refresh();img.addEventListener('click',e=>{const r=img.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*720,y=(e.clientY-r.top)/r.height*1280;api('/api/desktop-click',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({x,y})})});function key(k){api('/api/desktop-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k})})}function sendText(){const t=document.getElementById('text');if(!t.value)return;api('/api/desktop-type',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t.value})});t.value=''}document.getElementById('text').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendText();key('Return')}})</script></body></html>
