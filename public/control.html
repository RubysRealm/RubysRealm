<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Takarada Cloud Control</title><style>body{margin:0;background:#090a0f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:700px;margin:auto;padding:18px}.card{background:#151722;border:1px solid #2b2e3b;border-radius:18px;padding:18px;margin:13px 0}h1{font-size:28px;margin:0 0 4px}h1 b{color:#ff3158}.sub{color:#a4a8b5;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}button{border:0;border-radius:13px;padding:16px 10px;background:#292d3c;color:#fff;font-weight:850;font-size:15px}.red{background:#ff3158}.green{background:#13835b}.stop{background:#8c2a3d}#status{line-height:1.6}.ok{color:#3ee49a}.warn{color:#ffbf52}a{color:#fff}</style></head><body><main><h1>TAKARADA <b>CLOUD LIVE</b></h1><div class="sub">Phone control — no PC required after deployment</div><div class="card"><div id="now">Loading…</div><div class="sub" id="next"></div></div><div class="card"><div class="grid"><button class="green" onclick="go('start')">🔴 START CLOUD LIVE</button><button class="stop" onclick="go('stop')">■ STOP LIVE</button><button onclick="go('prev')">⏮ Previous</button><button class="red" onclick="go('next')">Next ⏭</button><button onclick="go('play')">▶ Play</button><button onclick="go('pause')">⏸ Pause</button></div></div><div class="card" id="status" style="white-space:pre-line">Checking cloud service…</div><div class="card"><a href="/preview" target="_blank">Open layout preview</a><p>Actual cloud picture:</p><img id="cloudFrame" style="width:100%;max-width:300px" alt="Cloud renderer picture"></div><script>const token=new URLSearchParams(location.search).get('token')||'';async function go(a){const r=await fetch('/api/action/'+a+'?token='+encodeURIComponent(token),{method:'POST'});const j=await r.json();document.getElementById('status').textContent=j.message;setTimeout(load,400)}async function load(){const s=await(await fetch('/api/state')).json();document.getElementById('now').textContent=`${s.index+1}/${s.count} • ${s.current.title}`;document.getElementById('next').textContent='Next: '+s.next.title;document.getElementById('status').textContent=[s.broadcasting?'● Broadcasting':'● Not broadcasting','Cloud gameplay: '+s.cloudPlayerState.label,s.cloudPlayerState.error||'',s.cloudPlayerState.diagnostic||'',s.rtmpConfigured?'TikTok destination configured':'TikTok stream destination still needed','TikTok events: '+(s.tiktokConnected?'connected':'not connected')].filter(Boolean).join('\n');document.getElementById('cloudFrame').src='/api/cloud-frame?token='+encodeURIComponent(token)+'&t='+Math.floor(Date.now()/10000);}setInterval(load,2500);load();</script></main></body></html>
