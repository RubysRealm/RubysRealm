<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Takarada Cloud Live</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;color:#fff;font-family:Arial,Helvetica,sans-serif}#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:#05060a}#avatarZone{position:absolute;top:0;left:0;width:100%;height:36%;overflow:hidden;background:#0e0d18}.avatarBase,.headLayer,.armLayer{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;object-position:center 45%}.avatarBase{animation:breathe 4.8s ease-in-out infinite}.headLayer{clip-path:polygon(39% 1%,84% 0,89% 58%,40% 58%);transform-origin:61% 37%;animation:headBob 5.8s ease-in-out infinite}.armLayer{clip-path:polygon(57% 43%,100% 36%,100% 100%,52% 100%);transform-origin:69% 58%;animation:armPlay 2.4s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1.01)}50%{transform:scale(1.034) translateY(2px)}}@keyframes headBob{0%,100%{transform:rotate(0)}32%{transform:rotate(-1.7deg) translateY(1px)}68%{transform:rotate(1.2deg)}}@keyframes armPlay{0%,100%{transform:rotate(0) translate(0,0)}25%{transform:rotate(-1.6deg) translate(-3px,2px)}50%{transform:rotate(1.1deg) translate(3px,-1px)}75%{transform:rotate(-.7deg) translate(-1px,1px)}}#shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(3,3,7,.72));z-index:4;pointer-events:none}#brand{position:absolute;top:3%;left:3%;font-size:3.8vh;font-weight:1000;font-style:italic;text-shadow:0 3px 14px #000;z-index:8}#brand b{color:#ff3158}.pill{font-size:1.7vh;background:#ff3158;padding:.6vh 1vh;border-radius:1vh;vertical-align:.6vh}#speech{position:absolute;left:3%;bottom:4%;max-width:60%;padding:1.15vh 1.4vh;background:rgba(0,0,0,.72);border-left:.45vh solid #ff3158;border-radius:.7vh;font-size:1.65vh;font-weight:800;z-index:9;opacity:0;transform:translateY(7px);transition:.3s}#speech.show{opacity:1;transform:none}#chat{position:absolute;right:2.5%;top:15%;width:37%;max-height:68%;overflow:hidden;z-index:9}.chatLine,.eventLine{font-size:1.34vh;margin:.5vh 0;padding:.6vh .8vh;border-radius:.72vh;text-shadow:0 2px 5px #000}.chatLine{background:rgba(0,0,0,.56)}.eventLine{background:rgba(255,49,88,.22);border:1px solid rgba(255,49,88,.5)}#gameZone{position:absolute;left:0;top:36%;width:100%;height:49%;background:#000;overflow:hidden}#game{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}#gameTitle{position:absolute;top:2%;left:2.5%;z-index:5;padding:.72vh 1vh;background:rgba(0,0,0,.67);border-radius:.6vh;font-size:1.5vh;font-weight:800}#status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;padding:1vh 1.2vh;border-radius:.7vh;background:rgba(0,0,0,.68);font-size:1.55vh;font-weight:900}#tap{display:none;position:absolute;inset:0;z-index:10;align-items:center;justify-content:center;background:rgba(0,0,0,.18)}#tap button{border:0;border-radius:999px;background:#ff1744;color:#fff;font-size:2.2vh;font-weight:900;padding:1.5vh 2.3vh}#bottom{position:absolute;left:0;bottom:0;width:100%;height:15%;background:linear-gradient(180deg,#090a11,#040508);padding:2vh 3%}.chip{display:inline-block;padding:.7vh 1vh;margin-right:.55vh;border:1px solid #353847;border-radius:999px;font-size:1.28vh;background:#141620}#bottom h2{font-size:2vh;margin:1.2vh 0 .42vh}#bottom p{font-size:1.24vh;color:#b7bac6;margin:0}</style><script src="/socket.io/socket.io.js"></script></head><body><div id="app"><div id="avatarZone"><img class="avatarBase" src="/takarada-avatar.jpg"><img class="headLayer" src="/takarada-avatar.jpg"><img class="armLayer" src="/takarada-avatar.jpg"><div id="shade"></div><div id="brand">TAKARADA <b>LIVE</b> <span class="pill">LIVE</span></div><div id="speech"></div><div id="chat"></div></div><div id="gameZone"><video id="game" autoplay muted playsinline preload="auto"></video><div id="gameTitle">Loading…</div><div id="status">STARTING GAMEPLAY…</div><div id="tap"><button id="tapBtn">▶ TAP TO PREVIEW</button></div></div><div id="bottom"><span class="chip">🎮 FULL LONGPLAY</span><span class="chip">💬 REAL LIVE CHAT</span><span class="chip">🎧 TAKARADA REACTIONS</span><h2>WATCH THE BUILD WITH TAKARADA</h2><p>Full gameplay • oldest → newest • real comments, follows and gifts when connected</p></div></div><script>const socket=io(),params=new URLSearchParams(location.search),isCloud=params.get('renderer')==='cloud',game=document.getElementById('game'),title=document.getElementById('gameTitle'),statusEl=document.getElementById('status'),tap=document.getElementById('tap'),chat=document.getElementById('chat'),speech=document.getElementById('speech');let state=null,lastId=null,loadSeq=0;function report(code,label){fetch('/api/player-state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({renderer:isCloud?'cloud':'preview',code,label,videoId:state?.current?.id||null})}).catch(()=>{})}function say(t,ms=5200){speech.textContent=t;speech.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>speech.classList.remove('show'),ms)}function addLine(t,c='chatLine'){const d=document.createElement('div');d.className=c;d.textContent=t;chat.appendChild(d);while(chat.children.length>7)chat.removeChild(chat.firstChild)}async function loadVideo(){if(!state?.current?.id||lastId===state.current.id)return;const seq=++loadSeq,last=state.current.id;lastId=last;title.textContent=`#${state.index+1}/${state.count} • ${state.current.title}`;statusEl.textContent='GETTING GAMEPLAY…';statusEl.style.display='block';tap.style.display='none';try{const r=await fetch('/api/media/'+encodeURIComponent(last),{cache:'no-store'}),j=await r.json();if(seq!==loadSeq)return;if(!j.ok||!j.url)throw new Error(j.error||'media unavailable');game.pause();game.src=j.url;game.muted=true;game.load();if(state.playing)await game.play().catch(()=>{});if(!isCloud)setTimeout(()=>{if(game.paused)tap.style.display='flex'},2500)}catch(e){statusEl.textContent='RETRYING GAMEPLAY…';report(-2,'resolve-error');setTimeout(()=>{lastId=null;loadVideo()},5000)}}game.addEventListener('loadstart',()=>report(0,'loading'));game.addEventListener('waiting',()=>{statusEl.textContent='BUFFERING…';statusEl.style.display='block';report(3,'buffering')});game.addEventListener('playing',()=>{statusEl.style.display='none';tap.style.display='none';report(1,'playing');setTimeout(()=>{try{game.muted=false;game.volume=.58}catch{}},1000)});game.addEventListener('pause',()=>report(2,'paused'));game.addEventListener('error',()=>{statusEl.textContent='RETRYING GAMEPLAY…';report(-3,'media-error');setTimeout(()=>{lastId=null;loadVideo()},4000)});game.addEventListener('ended',()=>{fetch('/api/video-ended',{method:'POST'}).catch(()=>{})});document.getElementById('tapBtn').onclick=()=>{game.muted=true;game.play().then(()=>tap.style.display='none').catch(()=>{})};async function boot(){state=await(await fetch('/api/state',{cache:'no-store'})).json();loadVideo()}socket.on('status',s=>{state=s;loadVideo()});socket.on('queue',s=>{state=s;lastId=null;loadVideo()});socket.on('playback',p=>{if(state)state.playing=p.playing;p.playing?game.play().catch(()=>{}):game.pause()});socket.on('chat',c=>addLine(`${c.user}: ${c.text}`));socket.on('event',e=>{if(e.type==='follow'){addLine(`➕ ${e.text}`,'eventLine');say('Thanks for the follow.')}else if(e.type==='gift'){addLine(`🎁 ${e.text}`,'eventLine');say('Yo, thank you for the gift.')}else if(e.type==='commentary')say(e.text)});boot();</script></body></html>
