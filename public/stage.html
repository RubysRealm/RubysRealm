<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Takarada Cloud Live</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;color:#fff;font-family:Arial,Helvetica,sans-serif}#app{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);margin:auto;overflow:hidden;background:#05060a}#avatarZone{position:absolute;top:0;left:0;width:100%;height:36%;overflow:hidden;background:#0e0d18}.avatarVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 48%;transform:scale(1.03);transition:opacity .18s}.avatarTalking,.avatarAction{opacity:0}#avatarZone.chatting .avatarIdle,#avatarZone.drinking .avatarIdle,#avatarZone.snacking .avatarIdle,#avatarZone.reacting .avatarIdle{opacity:0}#avatarZone.chatting .avatarChat{opacity:1}#avatarZone.drinking .avatarDrink{opacity:1}#avatarZone.snacking .avatarSnack{opacity:1}#avatarZone.reacting .avatarAction{opacity:0}#avatarZone.reacting .avatarTalking{opacity:1}#avatarFX{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(110deg,transparent 40%,rgba(255,28,72,.08) 50%,transparent 60%);background-size:230% 100%;animation:avatarSweep 8s linear infinite;mix-blend-mode:screen}@keyframes avatarSweep{from{background-position:180% 0}to{background-position:-80% 0}}#shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(3,3,7,.72));z-index:4;pointer-events:none}#brand{position:absolute;top:3%;left:3%;font-size:3.8vh;font-weight:1000;font-style:italic;text-shadow:0 3px 14px #000;z-index:8}#brand b{color:#ff3158}.pill{font-size:1.7vh;background:#ff3158;padding:.6vh 1vh;border-radius:1vh;vertical-align:.6vh}#speech{position:absolute;left:3%;bottom:4%;max-width:60%;padding:1.15vh 1.4vh;background:rgba(0,0,0,.72);border-left:.45vh solid #ff3158;border-radius:.7vh;font-size:1.65vh;font-weight:800;z-index:9;opacity:0;transform:translateY(7px);transition:.3s}#speech.show{opacity:1;transform:none}#recentActivity{position:absolute;left:3%;top:12%;z-index:9;display:flex;gap:.7vh;max-width:65%}.recentCard{background:rgba(5,6,10,.76);border:1px solid rgba(255,255,255,.16);border-radius:.8vh;padding:.55vh .8vh;min-width:13vh}.recentLabel{display:block;color:#ff6d89;font-size:1.05vh;font-weight:900;text-transform:uppercase}.recentValue{display:block;font-size:1.22vh;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:18vh}#chat{position:absolute;right:2.5%;top:15%;width:37%;max-height:68%;overflow:hidden;z-index:9}.chatLine,.eventLine{font-size:1.34vh;margin:.5vh 0;padding:.6vh .8vh;border-radius:.72vh;text-shadow:0 2px 5px #000}.chatLine{background:rgba(0,0,0,.56)}.eventLine{background:rgba(255,49,88,.22);border:1px solid rgba(255,49,88,.5)}#gameZone{position:absolute;left:0;top:36%;width:100%;height:49%;background:#000;overflow:hidden}#yt{position:absolute;left:50%;top:50%;width:100%;height:100%;transform:translate(-50%,-50%)}#gameTitle{position:absolute;top:2%;left:2.5%;z-index:5;padding:.72vh 1vh;background:rgba(0,0,0,.67);border-radius:.6vh;font-size:1.5vh;font-weight:800;pointer-events:none}#tap{display:none;position:absolute;inset:0;z-index:10;align-items:center;justify-content:center;background:rgba(0,0,0,.12)}#tap button{border:0;border-radius:999px;background:#ff1744;color:#fff;font-size:2.2vh;font-weight:900;padding:1.5vh 2.3vh;box-shadow:0 8px 28px rgba(0,0,0,.38)}#bottom{position:absolute;left:0;bottom:0;width:100%;height:15%;background:linear-gradient(180deg,#090a11,#040508);padding:2vh 3%}.chip{display:inline-block;padding:.7vh 1vh;margin-right:.55vh;border:1px solid #353847;border-radius:999px;font-size:1.28vh;background:#141620}#bottom h2{font-size:2vh;margin:1.2vh 0 .42vh}#bottom p{font-size:1.24vh;color:#b7bac6;margin:0}</style><script src="/socket.io/socket.io.js"></script></head><body><div id="app"><div id="avatarZone"><video class="avatarVideo avatarIdle" src="/takarada-streamer.webm" autoplay muted loop playsinline></video><video class="avatarVideo avatarTalking" src="/takarada-talking.webm" autoplay muted loop playsinline></video><video class="avatarVideo avatarAction avatarChat" src="/takarada-chat.webm" muted playsinline preload="auto"></video><video class="avatarVideo avatarAction avatarDrink" src="/takarada-drink.webm" muted playsinline preload="auto"></video><video class="avatarVideo avatarAction avatarSnack" src="/takarada-snack.webm" muted playsinline preload="auto"></video><div id="avatarFX"></div><div id="shade"></div><div id="brand">TAKARADA <span class="pill">LIVE</span></div><div id="recentActivity"><div class="recentCard"><span class="recentLabel">Recent follower</span><span class="recentValue" id="recentFollower">Waiting for LIVE</span></div><div class="recentCard"><span class="recentLabel">Recent gift</span><span class="recentValue" id="recentGift">Waiting for LIVE</span></div></div><div id="speech"></div><div id="chat"></div></div><div id="gameZone"><div id="yt"></div><video id="nativeVideo" playsinline style="display:none;width:100%;height:100%;object-fit:cover"></video><div id="gameTitle">Loading…</div><div id="tap"><button id="tapBtn">▶ START GAMEPLAY</button></div></div><div id="bottom"><span class="chip">🎮 FULL LONGPLAY</span><span class="chip">💬 REAL LIVE CHAT</span><span class="chip">🎧 TAKARADA REACTIONS</span><h2>WATCH THE BUILD WITH TAKARADA</h2><p>Full gameplay • oldest → newest • real comments, follows and gifts when connected</p></div></div><script src="/stage.js"></script></body></html>
