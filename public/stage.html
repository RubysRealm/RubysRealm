<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Takarada Cloud Live</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;color:#fff;font-family:Arial,Helvetica,sans-serif}#app{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);margin:auto;overflow:hidden;background:#05060a}#avatarZone{position:absolute;top:0;left:0;width:100%;height:36%;overflow:hidden;background:#0e0d18}.avatarBase,.headLayer,.armLayer{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;object-position:center 45%}.avatarBase{animation:breathe 4.8s ease-in-out infinite}.headLayer{clip-path:polygon(39% 1%,84% 0,89% 58%,40% 58%);transform-origin:61% 37%;animation:headBob 5.8s ease-in-out infinite}.armLayer{clip-path:polygon(57% 43%,100% 36%,100% 100%,52% 100%);transform-origin:69% 58%;animation:armPlay 2.4s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1.01)}50%{transform:scale(1.034) translateY(2px)}}@keyframes headBob{0%,100%{transform:rotate(0)}32%{transform:rotate(-1.7deg) translateY(1px)}68%{transform:rotate(1.2deg)}}@keyframes armPlay{0%,100%{transform:rotate(0) translate(0,0)}25%{transform:rotate(-1.6deg) translate(-3px,2px)}50%{transform:rotate(1.1deg) translate(3px,-1px)}75%{transform:rotate(-.7deg) translate(-1px,1px)}}#shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(3,3,7,.72));z-index:4;pointer-events:none}#brand{position:absolute;top:3%;left:3%;font-size:3.8vh;font-weight:1000;font-style:italic;text-shadow:0 3px 14px #000;z-index:8}#brand b{color:#ff3158}.pill{font-size:1.7vh;background:#ff3158;padding:.6vh 1vh;border-radius:1vh;vertical-align:.6vh}#speech{position:absolute;left:3%;bottom:4%;max-width:60%;padding:1.15vh 1.4vh;background:rgba(0,0,0,.72);border-left:.45vh solid #ff3158;border-radius:.7vh;font-size:1.65vh;font-weight:800;z-index:9;opacity:0;transform:translateY(7px);transition:.3s}#speech.show{opacity:1;transform:none}#chat{position:absolute;right:2.5%;top:15%;width:37%;max-height:68%;overflow:hidden;z-index:9}.chatLine,.eventLine{font-size:1.34vh;margin:.5vh 0;padding:.6vh .8vh;border-radius:.72vh;text-shadow:0 2px 5px #000}.chatLine{background:rgba(0,0,0,.56)}.eventLine{background:rgba(255,49,88,.22);border:1px solid rgba(255,49,88,.5)}#gameZone{position:absolute;left:0;top:36%;width:100%;height:49%;background:#000;overflow:hidden}#yt{position:absolute;left:50%;top:50%;width:100%;height:100%;transform:translate(-50%,-50%)}#gameTitle{position:absolute;top:2%;left:2.5%;z-index:5;padding:.72vh 1vh;background:rgba(0,0,0,.67);border-radius:.6vh;font-size:1.5vh;font-weight:800;pointer-events:none}#tap{display:none;position:absolute;inset:0;z-index:10;align-items:center;justify-content:center;background:rgba(0,0,0,.12)}#tap button{border:0;border-radius:999px;background:#ff1744;color:#fff;font-size:2.2vh;font-weight:900;padding:1.5vh 2.3vh;box-shadow:0 8px 28px rgba(0,0,0,.38)}#bottom{position:absolute;left:0;bottom:0;width:100%;height:15%;background:linear-gradient(180deg,#090a11,#040508);padding:2vh 3%}.chip{display:inline-block;padding:.7vh 1vh;margin-right:.55vh;border:1px solid #353847;border-radius:999px;font-size:1.28vh;background:#141620}#bottom h2{font-size:2vh;margin:1.2vh 0 .42vh}#bottom p{font-size:1.24vh;color:#b7bac6;margin:0}</style><script src="/socket.io/socket.io.js"></script></head><body><div id="app"><div id="avatarZone"><img class="avatarBase" src="/takarada-avatar.jpg"><img class="headLayer" src="/takarada-avatar.jpg"><img class="armLayer" src="/takarada-avatar.jpg"><div id="shade"></div><div id="brand">TAKARADA <b>LIVE</b> <span class="pill">LIVE</span></div><div id="speech"></div><div id="chat"></div></div><div id="gameZone"><div id="yt"></div><div id="gameTitle">Loading…</div><div id="tap"><button id="tapBtn">▶ START GAMEPLAY</button></div></div><div id="bottom"><span class=
