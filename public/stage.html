<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Takarada Cloud Live</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;color:#fff;font-family:Arial,Helvetica,sans-serif}#app{position:relative;width:100vw;height:100vh;background:#05060a;overflow:hidden}#avatarZone{position:absolute;top:0;left:0;width:100%;height:36%;overflow:hidden;background:linear-gradient(135deg,#0d0c15,#161225)}.avatarBase,.headLayer,.armLayer{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;object-position:center 47%}.avatarBase{animation:breathe 5s ease-in-out infinite}.headLayer{clip-path:polygon(36% 0,82% 0,88% 54%,38% 56%);transform-origin:59% 38%;animation:headBob 6.5s ease-in-out infinite}.armLayer{clip-path:polygon(60% 44%,100% 40%,100% 100%,58% 100%);transform-origin:68% 55%;animation:armPlay 3.2s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1.015)}50%{transform:scale(1.035) translateY(2px)}}@keyframes headBob{0%,100%{transform:rotate(0)}35%{transform:rotate(-1.5deg) translateY(1px)}70%{transform:rotate(1deg)}}@keyframes armPlay{0%,100%{transform:rotate(0) translate(0,0)}25%{transform:rotate(-1.4deg) translate(-2px,2px)}50%{transform:rotate(.9deg) translate(2px,-1px)}75%{transform:rotate(-.5deg) translate(-1px,1px)}}#brand{position:absolute;top:3%;left:3%;font-size:3.8vh;font-weight:1000;font-style:italic;text-shadow:0 3px 14px #000;z-index:7}#brand b{color:#ff3158}.pill{font-size:1.8vh;background:#ff3158;padding:.6vh 1vh;border-radius:1vh;vertical-align:.6vh}#speech{position:absolute;left:3%;bottom:4%;max-width:56%;padding:1.2vh 1.5vh;background:rgba(0,0,0,.74);border-left:.45vh solid #ff3158;border-radius:.7vh;font-size:1.75vh;font-weight:800;z-index:8;opacity:0;transform:translateY(8px);transition:.3s}#speech.show{opacity:1;transform:none}#chat{position:absolute;right:2.8%;top:14%;width:36%;max-height:72%;overflow:hidden;z-index:8}.chatLine{font-size:1.45vh;margin:.55vh 0;padding:.65vh .85vh;border-radius:.75vh;background:rgba(0,0,0,.58);text-shadow:0 2px 5px #000}.eventLine{font-size:1.45vh;margin:.55vh 0;padding:.65vh .85vh;border-radius:.75vh;background:rgba(255,49,88,.22);border:1px solid rgba(255,49,88,.5)}#gameZone{position:absolute;left:0;top:36%;width:100%;height:49%;background:#000;overflow:hidden}#yt{position:absolute;left:50%;top:50%;width:177.8%;height:100%;transform:translate(-50%,-50%);pointer-events:none}#gameTitle{position:absolute;top:2%;left:2.5%;z-index:5;padding:.7vh 1vh;background:rgba(0,0,0,.65);border-radius:.6vh;font-size:1.55vh;font-weight:800}#bottom{position:absolute;left:0;bottom:0;width:100%;height:15%;background:linear-gradient(180deg,#090a11,#040508);padding:2.1vh 3%}.chip{display:inline-block;padding:.75vh 1.1vh;margin-right:.6vh;border:1px solid #353847;border-radius:999px;font-size:1.35vh;background:#141620}#bottom h2{font-size:2.1vh;margin:1.2vh 0 .45vh}#bottom p{font-size:1.3vh;color:#b7bac6;margin:0}</style><script src="https://www.youtube.com/iframe_api"></script><script src="/socket.io/socket.io.js"></script></head><body><div id="app"><div id="avatarZone"><img class="avatarBase" id="a1"><img class="headLayer" id="a2"><img class="armLayer" id="a3"><div id="brand">TAKARADA <b>LIVE</b> <span class="pill">LIVE</span></div><div id="speech"></div><div id="chat"></div></div><div id="gameZone"><div id="yt"></div><div id="gameTitle">Loading…</div></div><div id="bottom"><span class="chip">🎮 FULL LONGPLAY</span><span class="chip">💬 REAL LIVE CHAT</span><span class="chip">🎧 TAKARADA REACTIONS</span><h2>WATCH THE BUILD WITH TAKARADA</h2><p>Full gameplay • oldest → newest • real TikTok comments/follows/gifts when connected</p></div></div><script>const img='data:image/jpeg;base64,PLACEHOLDER';for(const id of ['a1','a2','a3'])document.getElementById(id).src=img;const socket=io();let state=null,player=null,api=false,lastId=null;const title=document.getElementById('gameTitle'),chat=document.getElementById('chat'),speech=document.getElementById('speech');function say(text,ms=5200){speech.textContent=text;speech.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>speech.classList.remove('show'),ms)}function addLine(text,cls='chatLine'){const d=document.createElement('div');d.className=cls;d.textContent=text;chat.appendChild(d);while(chat.children.length>7)chat.removeChild(chat.firstChild)}function loadVideo(){if(!api||!player||!state?.current?.id)return;if(lastId===state.current.id)return;lastId=state.current.id;title.textContent=`#${state.index+1}/${state.count} • ${state.current.title}`;player.mute();player.loadVideoById(state.current.id);if(state.playing)player.playVideo()}window.onYouTubeIframeAPIReady=()=>{api=true;player=new YT.Player('yt',{playerVars:{autoplay:1,mute:1,controls:0,rel:0,fs:0,playsinline:1,disablekb:1,iv_load_policy:3},events:{onReady:loadVideo,onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING)setTimeout(()=>{try{player.unMute();player.setVolume(65)}catch{}},1200);if(e.data===YT.PlayerState.ENDED)fetch('/api/video-ended',{method:'POST'})},onError:()=>setTimeout(()=>{lastId=null;loadVideo()},2500)}})};async function boot(){state=await(await fetch('/api/state')).json();loadVideo()}socket.on('status',s=>{state=s;loadVideo()});socket.on('queue',s=>{state=s;lastId=null;loadVideo()});socket.on('playback',p=>{state.playing=p.playing;if(player)(p.playing?player.playVideo():player.pauseVideo())});socket.on('chat',c=>addLine(`${c.user}: ${c.text}`));socket.on('event',e=>{if(e.type==='follow'){addLine(`➕ ${e.text}`,'eventLine');say('Thanks for the follow.')}else if(e.type==='gift'){addLine(`🎁 ${e.text}`,'eventLine');say('Yo, thank you for the gift.')}else if(e.type==='commentary')say(e.text)});boot();</script></body></html>
