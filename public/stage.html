<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Takarada Gameplay Live</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#app,#gameZone{position:absolute;inset:0;width:100%;height:100%;background:#000;overflow:hidden}#yt{position:absolute;inset:0;width:100%;height:100%}#nativeVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}#tap{display:none;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;background:rgba(0,0,0,.38)}#tap button{border:0;border-radius:999px;background:#fff;color:#000;font:800 18px system-ui;padding:14px 22px}#status{position:absolute;left:12px;bottom:12px;z-index:10;color:#fff;background:rgba(0,0,0,.62);font:600 12px system-ui;padding:7px 9px;border-radius:7px;opacity:0;transition:.2s}#status.show{opacity:1}</style>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div id="app"><div id="gameZone"><div id="yt"></div><video id="nativeVideo" playsinline></video><div id="tap"><button id="tapBtn">▶ START GAMEPLAY + AUDIO</button></div><div id="status"></div></div></div>
<script src="/stage.js"></script>
</body>
</html>
