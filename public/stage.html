<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Takarada Cloud Live</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;color:#fff;font-family:Arial,Helvetica,sans-serif}#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:#05060a}#avatarZone{position:absolute;top:0;left:0;width:100%;height:36%;overflow:hidden;background:#0e0d18}.avatarBase,.headLayer,.armLayer{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;object-position:center 45%}.avatarBase{animation:breathe 4.8s ease-in-out infinite}.headLayer{clip-path:polygon(39% 1%,84% 0,89% 58%,40% 58%);transform-origin:61% 37%;animation:headBob 5.8s ease-in-out infinite}.armLayer{clip-path:polygon(57% 43%,100% 36%,100% 100%,52% 100%);transform-origin:69% 58%;animation:armPlay 2.4s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1.01)}50%{transform:scale(1.034) translateY(2px)}}@keyframes headBob{0%,100%{transform:rotate(0deg)}32%{transform:rotate(-1.7deg) translateY(1px)}68%{transform:rotate(1.2deg)}}@keyframes armPlay{0%,100%{transform:rotate(0deg) translate(0,0)}25%{transform:rotate(-1.6deg) translate(-3px,2px)}50%{transform:rotate(1.1deg) translate(3px,-1px)}75%{transform:rotate(-.7deg) translate(-1px,1px)}}#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.08) 58%,rgba(3,3,7,.72));z-index:4;pointer-events:none}#brand{position:absolute;top:3%;left:3%;font-size:3.8vh;font-weight:1000;font-style:italic;text-shadow:0 3px 14px #000;z-index:8}#brand b{color:#ff3158}.pill{font-size:1.7vh;background:#ff3158;padding:.6vh 1vh;border-radius:1vh;vertical-align:.6vh}#speech{position:absolute;left:3%;bottom:4%;max-width:60%;padding:1.15vh 1.4vh;background:rgba(0,0,0,.72);border-left:.45vh solid #ff3158;border-radius:.7vh;font-size:1.65vh;font-weight:800;z-index:9;opacity:0;transform:translateY(7px);transition:.3s}#speech.show{opacity:1;transform:none}#chat{position:absolute;right:2.5%;top:15%;width:37%;max-height:68%;overflow:hidden;z-index:9}.chatLine,.eventLine{font-size:1.34vh;margin:.5vh 0;padding:.6vh .8vh;border-radius:.72vh;text-shadow:0 2px 5px #000}.chatLine{background:rgba(0,0,0,.56)}.eventLine{background:rgba(255,49,88,.22);border:1px solid rgba(255,49,88,.5)}#gameZone{position:absolute;left:0;top:36%;width:100%;height:49%;background:#000;overflow:hidden}#yt{position:absolute;left:50%;top:50%;width:177.8%;height:100%;transform:translate(-50%,-50%);pointer-events:none}#gameTitle{position:absolute;top:2%;left:2.5%;z-index:5;padding:.72vh 1vh;background:rgba(0,0,0,.67);border-radius:.6vh;font-size:1.5vh;font-weight:800}#tap{display:none;position:absolute;inset:0;z-index:10;align-items:center;justify-content:center;background:rgba(0,0,0,.18)}#tap button{border:0;border-radius:999px;background:#ff1744;color:#fff;font-size:2.2vh;font-weight:900;padding:1.5vh 2.3vh;box-shadow:0 8px 28px rgba(0,0,0,.38)}#bottom{position:absolute;left:0;bottom:0;width:100%;height:15%;background:linear-gradient(180deg,#090a11,#040508);padding:2vh 3%}.chip{display:inline-block;padding:.7vh 1vh;margin-right:.55vh;border:1px solid #353847;border-radius:999px;font-size:1.28vh;background:#141620}#bottom h2{font-size:2vh;margin:1.2vh 0 .42vh}#bottom p{font-size:1.24vh;color:#b7bac6;margin:0}</style><script src="https://www.youtube.com/iframe_api"></script><script src="/socket.io/socket.io.js"></script></head><body><div id="app"><div id="avatarZone"><img class="avatarBase" src="/takarada-avatar.jpg"><img class="headLayer" src="/takarada-avatar.jpg"><img class="armLayer" src="/takarada-avatar.jpg"><div id="shade"></div><div id="brand">TAKARADA <b>LIVE</b> <span class="pill">LIVE</span></div><div id="speech"></div><div id="chat"></div></div><div id="gameZone"><div id="yt"></div><div id="gameTitle">Loading…</div><div id="tap"><button id="tapBtn">▶ TAP TO PREVIEW</button></div></div><div id="bottom"><span class="chip">🎮 FULL LONGPLAY</span><span class="chip">💬 REAL LIVE CHAT</span><span class="chip">🎧 TAKARADA REACTIONS</span><h2>WATCH THE BUILD WITH TAKARADA</h2><p>Full gameplay • oldest → newest • real comments, follows and gifts when connected</p></div></div><script>const socket=io();const params=new URLSearchParams(location.search);const isCloud=params.get('renderer')==='cloud';let state=null,player=null,api=false,lastId=null;const title=document.getElementById('gameTitle'),chat=document.getElementById('chat'),speech=document.getElementById('speech'),tap=document.getElementById('tap');function label(code){return ({'-1':'unstarted','0':'ended','1':'playing','2':'paused','3':'buffering','5':'cued'})[String(code)]||'unknown'}function report(code){fetch('/api/player-state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({renderer:isCloud?'cloud':'preview',code,label:label(code),videoId:state?.current?.id||null})}).catch(()=>{})}function say(text,ms=5200){speech.textContent=text;speech.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>speech.classList.remove('show'),ms)}function addLine(text,cls='chatLine'){const d=document.createElement('div');d.className=cls;d.textContent=text;chat.appendChild(d);while(chat.children.length>7)chat.removeChild(chat.firstChild)}function loadVideo(){if(!api||!player||!state?.current?.id)return;if(lastId===state.current.id)return;lastId=state.current.id;title.textContent=`#${state.index+1}/${state.count} • ${state.current.title}`;player.mute();player.loadVideoById(state.current.id);if(state.playing)player.playVideo();if(!isCloud)setTimeout(()=>{try{const s=player.getPlayerState();if(s!==1&&s!==3)tap.style.display='flex'}catch{}},3200)}window.onYouTubeIframeAPIReady=()=>{api=true;player=new YT.Player('yt',{playerVars:{autoplay:1,mute:1,controls:0,rel:0,fs:0,playsinline:1,disablekb:1,iv_load_policy:3},events:{onReady:()=>{loadVideo();if(state?.playing)player.playVideo()},onStateChange:e=>{report(e.data);if(e.data===YT.PlayerState.PLAYING){tap.style.display='none';setTimeout(()=>{try{player.unMute();player.setVolume(58)}catch{}},1200)}if(e.data===YT.PlayerState.ENDED)fetch('/api/video-ended',{method:'POST'})},onError:e=>{report(-100-e.data);setTimeout(()=>{lastId=null;loadVideo()},2500)}}})};document.getElementById('tapBtn').onclick=()=>{try{player.mute();player.playVideo();tap.style.display='none'}catch{}};async function boot(){state=await(await fetch('/api/state')).json();loadVideo()}socket.on('status',s=>{state=s;loadVideo()});socket.on('queue',s=>{state=s;lastId=null;loadVideo()});socket.on('playback',p=>{if(state)state.playing=p.playing;if(player)(p.playing?player.playVideo():player.pauseVideo())});socket.on('chat',c=>addLine(`${c.user}: ${c.text}`));socket.on('event',e=>{if(e.type==='follow'){addLine(`➕ ${e.text}`,'eventLine');say('Thanks for the follow.')}else if(e.type==='gift'){addLine(`🎁 ${e.text}`,'eventLine');say('Yo, thank you for the gift.')}else if(e.type==='commentary')say(e.text)});boot();</script></body></html>
