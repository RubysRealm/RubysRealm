<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Takarada Overlay</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e0d18;color:#fff;font-family:Arial,Helvetica,sans-serif}#avatarZone{position:absolute;inset:0;overflow:hidden;background:#0e0d18}.avatarVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 48%;opacity:0}.avatarIdle{opacity:1}#avatarZone.reacting .avatarIdle{opacity:0}#avatarZone.reacting .avatarTalking{opacity:1}#shade{position:absolute;inset:0;z-index:6;pointer-events:none;background:linear-gradient(180deg,transparent 58%,rgba(3,3,7,.48))}#speech{position:absolute;left:3%;bottom:4%;max-width:72%;padding:10px 13px;background:rgba(0,0,0,.72);border-left:4px solid #ff3158;border-radius:7px;font-size:18px;font-weight:800;z-index:10;opacity:0;transform:translateY(7px);transition:.2s}#speech.show{opacity:1;transform:none}#recentFollower,#recentGift,#chat{display:none!important}
</style><script src="/socket.io/socket.io.js"></script></head><body><div id="avatarZone"><video class="avatarVideo avatarIdle" src="/takarada-streamer.webm" autoplay muted loop playsinline></video><video class="avatarVideo avatarTalking" src="/takarada-talking.webm" autoplay muted loop playsinline></video><video class="avatarVideo avatarAction avatarChat" src="/takarada-chat.webm" muted playsinline></video><video class="avatarVideo avatarAction avatarDrink" src="/takarada-drink.webm" muted playsinline></video><video class="avatarVideo avatarAction avatarSnack" src="/takarada-snack.webm" muted playsinline></video><div id="shade"></div><div id="speech"></div><div id="recentFollower"></div><div id="recentGift"></div><div id="chat"></div></div><script src="/streamer-engine.js"></script><script>
const zone=document.getElementById('avatarZone'),speech=document.getElementById('speech');let timer=null;
function showSpeech(text,ms=5200){if(!text)return;clearTimeout(timer);speech.textContent=text;speech.classList.add('show');zone.classList.add('reacting');timer=setTimeout(()=>{speech.classList.remove('show');zone.classList.remove('reacting')},ms)}
if(typeof io==='function'){const socket=io();socket.on('event',e=>{if(e.type==='commentary')showSpeech(e.text);else if(e.type==='follow')showSpeech(`Thanks for the follow, ${e.user||'friend'}.`);else if(e.type==='gift')showSpeech(`${e.user||'Friend'}, thank you for the ${e.gift||'gift'}.`,6200);else if(e.type==='share')showSpeech(`${e.user||'Friend'}, thanks for sharing the live.`)});}
</script></body></html>
