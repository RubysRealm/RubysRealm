<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RubysRealm</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 50px 25px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 25px;
    }

    p {
      color: #ddd;
      font-size: 18px;
      line-height: 1.6;
    }

    #tiktokLogin {
      display: inline-block;
      background: #fe2c55;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 16px 28px;
      margin: 25px 0;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    a {
      color: #fe5b72;
      margin: 0 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>RubysRealm</h1>

  <p>
    RubysRealm is a short-form entertainment content creation and
    publishing application.
  </p>

  <p>
    Authorized users can connect their TikTok account and publish
    original entertainment content.
  </p>

  <button type="button" id="tiktokLogin">
    Continue with TikTok
  </button>

  <p>
    <a href="terms.html">Terms of Service</a>
    <a href="privacy.html">Privacy Policy</a>
  </p>

</div>

<script>
  const clientKey = "sbawhv40x6exj1qwu9";
  const redirectUri = "https://rubys-realm.vercel.app/api/callback";

  document.getElementById("tiktokLogin").onclick = function () {

    const state =
      Math.random().toString(36).substring(2) +
      Date.now().toString(36);

    sessionStorage.setItem("tiktok_oauth_state", state);

    const authUrl =
      "https://www.tiktok.com/v2/auth/authorize/?" +
      "client_key=" + encodeURIComponent(clientKey) +
      "&scope=" + encodeURIComponent("user.info.basic,video.publish") +
      "&response_type=code" +
      "&redirect_uri=" + encodeURIComponent(redirectUri) +
      "&state=" + encodeURIComponent(state);

    window.location.href = authUrl;
  };
</script>
<hr style="margin:40px 0;border-color:#333;">

<h2>Post to TikTok</h2>

<input
  type="file"
  id="videoFile"
  accept="video/mp4,video/quicktime,video/webm"
  style="margin:15px 0;"
>

<br>

<textarea
  id="caption"
  placeholder="TikTok caption..."
  maxlength="2200"
  style="width:90%;max-width:500px;height:100px;padding:12px;margin:15px 0;"
></textarea>

<br>

<button id="postTikTok" style="padding:15px 30px;">
  Post to TikTok
</button>

<p id="postStatus"></p>

<script>
document.getElementById("postTikTok").onclick = async function () {
  const file = document.getElementById("videoFile").files[0];
  const caption = document.getElementById("caption").value;
  const status = document.getElementById("postStatus");

  if (!file) {
    status.textContent = "Choose a video first.";
    return;
  }

  status.textContent = "Preparing TikTok post...";

  try {
    const initResponse = await fetch("/api/post", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        title: caption,
        video_size: file.size,
        privacy_level: "SELF_ONLY"
      })
    });

    const result = await initResponse.json();

    if (!initResponse.ok || result.error?.code !== "ok") {
      throw new Error(
        result.error?.message ||
        result.error ||
        "Could not initialize TikTok post."
      );
    }

    const uploadUrl = result.data?.upload_url;

    if (!uploadUrl) {
      throw new Error("TikTok did not return an upload URL.");
    }

    status.textContent = "Uploading video to TikTok...";

    const uploadResponse = await fetch(uploadUrl, {
      method: "PUT",
      headers: {
        "Content-Type": file.type || "video/mp4",
        "Content-Length": String(file.size),
        "Content-Range":
          "bytes 0-" + (file.size - 1) + "/" + file.size
      },
      body: file
    });

    if (!uploadResponse.ok) {
      throw new Error("Video upload failed.");
    }

    status.textContent =
      "Video sent to TikTok successfully. Publish ID: " +
      result.data.publish_id;

  } catch (error) {
    status.textContent = "Error: " + error.message;
  }
};
</script>
</body>
</html>
