<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RubysRealm</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 50px 25px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 25px;
    }

    p {
      color: #ddd;
      font-size: 18px;
      line-height: 1.6;
    }

    #tiktokLogin {
      display: inline-block;
      background: #fe2c55;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 16px 28px;
      margin: 25px 0;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    a {
      color: #fe5b72;
      margin: 0 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>RubysRealm</h1>

  <p>
    RubysRealm is a short-form entertainment content creation and
    publishing application.
  </p>

  <p>
    Authorized users can connect their TikTok account and publish
    original entertainment content.
  </p>

  <button type="button" id="tiktokLogin">
    Continue with TikTok
  </button>

  <p>
    <a href="terms.html">Terms of Service</a>
    <a href="privacy.html">Privacy Policy</a>
  </p>

</div>

<script>
  const clientKey = "sbawhv40x6exj1qwu9";
  const redirectUri = "https://rubys-realm.vercel.app/api/callback";

  document.getElementById("tiktokLogin").onclick = function () {

    const state =
      Math.random().toString(36).substring(2) +
      Date.now().toString(36);

    sessionStorage.setItem("tiktok_oauth_state", state);

    const authUrl =
      "https://www.tiktok.com/v2/auth/authorize/?" +
      "client_key=" + encodeURIComponent(clientKey) +
      "&scope=" + encodeURIComponent("user.info.basic") +
      "&response_type=code" +
      "&redirect_uri=" + encodeURIComponent(redirectUri) +
      "&state=" + encodeURIComponent(state);

    window.location.href = authUrl;
  };
</script>

</body>
</html>
